<title>词汇勇者：答题闯关</title>
<style>
  :root{
    --accent:#8b7bff; --accent2:#5eead4;
    --danger:#f87171; --ok:#34d399;
  }
  *{box-sizing:border-box; margin:0; padding:0; user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;
    background:radial-gradient(1200px 800px at 50% -10%,#2a2a4d 0%,#17172b 55%,#0d0d1a 100%);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#eaeaff;}
  /* 背景粒子层 */
  #bgParticles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  #bgParticles span{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.4;
    animation:floatP linear infinite;}
  @keyframes floatP{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-110vh) translateX(20px);opacity:0}}
  #app{position:fixed;inset:0;z-index:1;}
  #game{position:absolute;inset:0;display:block;}
  /* 覆盖 UI */
  #ui{position:absolute;inset:0;pointer-events:none;}
  .panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,460px);
    background:rgba(20,20,40,.82);border:1px solid rgba(139,123,255,.5);border-radius:18px;
    padding:26px;text-align:center;backdrop-filter:blur(12px);
    box-shadow:0 0 40px rgba(139,123,255,.25),0 18px 60px rgba(0,0,0,.55);
    pointer-events:auto;animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.85);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  #ui.hidden, .hidden{display:none!important;}
  h1.title{font-size:30px;letter-spacing:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:8px;animation:shine 3s linear infinite;text-shadow:0 0 30px rgba(139,123,255,.5);}
  @keyframes shine{to{background-position:200% center}}
  .sub{font-size:13px;opacity:.72;margin-bottom:20px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .lvl-btn,.opt-btn,.act-btn,.upgrade-btn{
    background:linear-gradient(180deg,rgba(139,123,255,.22),rgba(139,123,255,.06));
    border:1px solid rgba(139,123,255,.45);color:#fff;border-radius:12px;padding:14px 10px;cursor:pointer;
    font-size:15px;transition:.2s;width:100%;position:relative;overflow:hidden;}
  .lvl-btn::before,.opt-btn::before,.upgrade-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:.5s;}
  .lvl-btn:hover::before,.opt-btn:hover::before,.upgrade-btn:hover::before{left:100%}
  .lvl-btn:hover,.opt-btn:hover,.upgrade-btn:hover,.act-btn:hover{
    background:rgba(139,123,255,.4);transform:translateY(-2px);
    box-shadow:0 0 20px rgba(139,123,255,.5);}
  .lvl-btn b{display:block;font-size:17px;margin-bottom:2px;}
  .lvl-btn small{opacity:.65;font-weight:400;font-size:11px;}
  .lvl-btn.sel{outline:2px solid var(--accent2);box-shadow:0 0 25px rgba(94,234,212,.5);}
  .q-en{font-size:34px;font-weight:700;margin-bottom:6px;letter-spacing:1px;
    text-shadow:0 0 20px rgba(94,234,212,.4);}
  .q-zh{font-size:26px;font-weight:600;margin-bottom:18px;color:var(--accent2);
    text-shadow:0 0 15px rgba(94,234,212,.3);}
  .opt-btn{margin-top:8px;text-align:left;font-size:16px;}
  .opt-btn.correct{background:linear-gradient(90deg,#34d399,#10b981);border-color:var(--ok);color:#06281c;
    box-shadow:0 0 25px rgba(52,211,153,.6);animation:corrShake .3s;}
  .opt-btn.wrong{background:linear-gradient(90deg,#f87171,#ef4444);border-color:var(--danger);
    box-shadow:0 0 25px rgba(248,113,113,.6);animation:wrongShake .3s;}
  @keyframes corrShake{0%,100%{transform:translateX(0)}50%{transform:scale(1.03)}}
  @keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .hint{font-size:13px;margin-top:12px;opacity:.9;min-height:18px;}
  .upgrade-btn{border-radius:16px;padding:20px 12px;font-size:18px;font-weight:600;}
  .upgrade-btn u{display:block;font-size:12px;opacity:.8;margin-top:6px;text-decoration:none;}
  .upgrade-btn.w2{background:linear-gradient(180deg,rgba(248,113,113,.3),rgba(248,113,113,.08));border-color:#f87171;}
  .upgrade-btn.w2:hover{box-shadow:0 0 30px rgba(248,113,113,.6)}
  .upgrade-btn.ammo{background:linear-gradient(180deg,rgba(52,211,153,.3),rgba(52,211,153,.08));border-color:#34d399;}
  .upgrade-btn.ammo:hover{box-shadow:0 0 30px rgba(52,211,153,.6)}
  /* 血条 */
  .bar-row{position:absolute;left:50%;transform:translateX(-50%);}
  .bar-row.top{top:14px;} .bar-row.bottom{bottom:14px;}
  .bar{width:min(72vw,380px);height:16px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);
    border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.4);}
  .bar>i{display:block;height:100%;width:100%;transition:width .35s cubic-bezier(.4,0,.2,1);}
  .bar.hero>i{background:linear-gradient(90deg,#34d399,#3dd8ff,#5eead4);box-shadow:0 0 10px rgba(94,234,212,.5);}
  .bar.mon>i{background:linear-gradient(90deg,#f87171,#ff5c7a,#fb923c);box-shadow:0 0 10px rgba(248,113,113,.5);}
  .bar-label{font-size:13px;margin-bottom:5px;text-align:center;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.8);}
  /* 战斗状态栏 */
  #vsbar{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .vs-item{display:inline-block;background:rgba(20,20,40,.75);border:1px solid rgba(255,255,255,.2);border-radius:12px;
    padding:10px 18px;min-width:180px;backdrop-filter:blur(4px);}
  .vs-item.mon{background:rgba(60,10,20,.75);border-color:rgba(248,113,113,.5);box-shadow:0 0 15px rgba(248,113,113,.2);}
  .vs-item b{font-size:18px;color:var(--accent2)}
  .vs-item.mon b{color:#ff7a7a}
  .float{position:absolute;transform:translate(-50%,-50%);font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.7),0 0 10px currentColor;

  .float.dmg{color:#ffd27a;} .float.heal{color:#5eead4;} .float.hit{color:#ff7a7a;}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}15%{opacity:1;transform:translate(-50%,-40%) scale(1.2)}30%{transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-200%) scale(.8)}}
  .run-name{position:absolute;top:8px;left:14px;font-size:13px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.6);}
  .score-chip{position:absolute;top:8px;right:14px;font-size:13px;color:var(--accent2);font-weight:600;
    text-shadow:0 0 8px rgba(94,234,212,.5);}
  .tip-bottom{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.9;text-align:center;
    text-shadow:0 1px 4px rgba(0,0,0,.7);animation:tipPulse 2s ease-in-out infinite;}
  @keyframes tipPulse{0%,100%{opacity:.6}50%{opacity:1}}
  .btn-row{display:flex;gap:12px;justify-content:center;margin-top:18px;}
  .btn-main{background:linear-gradient(90deg,var(--accent),#6c5ce7);border:none;color:#fff;border-radius:12px;
    padding:13px 26px;font-size:15px;cursor:pointer;font-weight:600;
    box-shadow:0 0 20px rgba(139,123,255,.4);transition:.2s;}
  .btn-main:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 0 30px rgba(139,123,255,.6)}
  .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:12px;padding:13px 20px;cursor:pointer;font-size:14px;transition:.2s;}
  .btn-ghost:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5)}

    text-shadow:0 0 30px rgba(94,234,212,.6);animation:numPop .6s cubic-bezier(.34,1.56,.64,1);}

  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-4px,2px)}20%{transform:translate(4px,-2px)}30%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}50%{transform:translate(-2px,2px)}60%{transform:translate(2px,-2px)}70%{transform:translate(-1px,1px)}80%{transform:translate(1px,-1px)}90%{transform:translate(0,1px)}}
  /* 伤害红闪 */

  #damageFlash.active{opacity:1}
  /* 胜利金色粒子 */
  .win-burst{position:fixed;inset:0;pointer-events:none;z-index:9;}
  .win-burst i{position:absolute;width:8px;height:8px;border-radius:50%;animation:winBurst 1.2s ease-out forwards;}
  @keyframes winBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
</style>
</head>

    s.style.animationDelay=(Math.random()*12)+'s';
    s.style.opacity=(0.2+Math.random()*0.5);

})();

/* ============ 武器可视化（随 P.weapon 变化） ============ */
const WEAPON_COLORS = [0xc0c0c0, 0xa8e6ff, 0x5eead4, 0xffd27a, 0xff7a7a, 0xc084fc, 0xff5c7a];
const WEAPON_NAMES = ['铁剑','青铜剑','青寒刃','黄金圣剑','烈焰怒剑','紫电秘剑','绯红魔剑'];
const TIER_ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// 武器名称无限循环：基础名按等级循环，每满一轮提升一个阶段后缀(无尽头)
function weaponName(lv){
  const base = WEAPON_NAMES[lv % WEAPON_NAMES.length];
  const tier = Math.floor(lv / WEAPON_NAMES.length);
  if(tier===0) return base;
  const suffix = tier <= TIER_ROMAN.length ? TIER_ROMAN[tier-1] : 'Lv'+tier;
  return base + ' ·' + suffix;
}
// 主色无限循环，并随阶段提升微调色相
function weaponColor(lv){
  const base = WEAPON_COLORS[lv % WEAPON_COLORS.length];
  const tier = Math.floor(lv / WEAPON_COLORS.length);
  if(tier===0) return base;
  const c = new THREE.Color(base);
  c.offsetHSL(tier*0.07 % 1, 0, Math.min(tier*0.03, 0.15)); // 逐阶段微提亮度/色相
  return c.getHex();
}
function weaponLevel(){ return Math.round(Math.log2(Math.max(1,P.weapon))); }
// 随武器等级提升的攻速：等级越高，攻击间隔越短
function heroAttackInterval(){
  const lv = weaponLevel();
  return ATTACK_INTERVAL * Math.pow(ATK_SPEED_FACTOR, lv);
}
// 攻速倍率显示（相对基础攻速）
function heroAttackSpeedMult(){
  const lv = weaponLevel();
  return 1 / Math.pow(ATK_SPEED_FACTOR, lv);
}
function updateHeroWeapon(){
  const wg = heroGroup.weaponGroup;
  const og = heroGroup.orbitGroup;
  // 清空旧武器
  while(wg.children.length) disposeGroup(wg.children.pop());
  while(og.children.length) disposeGroup(og.children.pop());
  const lv = weaponLevel();
  const mainScale = 0.7 + lv * 0.18;
  const glow = 0.15 + lv * 0.12;
  const color = weaponColor(lv);
  // 主武器：一把剑（右手）
  const sword = new THREE.Group();
  const bladeMat = new THREE.MeshStandardMaterial({color, roughness:.3, metalness:.8, emissive:color, emissiveIntensity:glow});
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.2*mainScale, 0.06), bladeMat);
  blade.position.y = 0.6*mainScale;
  sword.add(blade);
  // 发光外层（高等级时明显）
  if(lv >= 1){
    const glowMat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.4+lv*0.06});
    const glowBlade = new THREE.Mesh(new THREE.BoxGeometry(0.32, 1.45*mainScale, 0.2), glowMat);
    glowBlade.position.y = 0.6*mainScale;
    sword.add(glowBlade);
  }
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.15), new THREE.MeshStandardMaterial({color:0xffd700,metalness:.9,roughness:.3}));
  sword.add(guard);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.3,8), new THREE.MeshStandardMaterial({color:0x5a3a1a,roughness:.7}));
  handle.position.y = -0.2;
  sword.add(handle);
  sword.rotation.z = -0.5;
  wg.add(sword);
  // 环绕武器：weapon 等级越高，环绕的剑越多
  const orbitCount = lv;
  for(let i=0;i<orbitCount;i++){
    const os = new THREE.Group();
    const oBladeMat = new THREE.MeshStandardMaterial({color, roughness:.3, metalness:.8, emissive:color, emissiveIntensity:glow});
    const oBlade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.8*mainScale, 0.05), oBladeMat);
    oBlade.position.y = 0.4*mainScale;
    os.add(oBlade);
    // 环绕剑发光外层
    const oGlow = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.0*mainScale, 0.14), new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.45}));
    oGlow.position.y = 0.4*mainScale;
    os.add(oGlow);
    const oGuard = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.07,0.1), new THREE.MeshStandardMaterial({color:0xffd700,metalness:.9}));
    os.add(oGuard);
    const angle = (i / orbitCount) * Math.PI * 2;
    const radius = 1.3 + lv*0.1;
    os.position.set(Math.cos(angle)*radius, 1.2 + Math.sin(angle*2)*0.2, Math.sin(angle)*radius);
    os.lookAt(0, 1.2, 0);
    og.add(os);
  }
}

}

  const eyeM=new THREE.MeshBasicMaterial({color: round%2?0xff3030:0xffd700});
  const e1=new THREE.Mesh(new THREE.SphereGeometry(.18,12,12),eyeM);e1.position.set(-0.32,2.6,0.6);g.add(e1);

  // 嘴巴
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(.7,.18,.1), new THREE.MeshBasicMaterial({color:0x1a0505}));

  // 獠牙

  const f2=f1.clone();f2.position.set(0.18,2.12,0.62);g.add(f2);
  // 角
  const hornM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4});
  const h1=new THREE.Mesh(new THREE.ConeGeometry(.2,.6,8),hornM);h1.position.set(-0.42,3.15,0);h1.rotation.z=0.25;g.add(h1);
  const h2=new THREE.Mesh(new THREE.ConeGeometry(.2,.6,8),hornM);h2.position.set(0.42,3.15,0);h2.rotation.z=-0.25;g.add(h2);
  // 头盔王冠装饰（BOSS身份象征）
  const crownM=new THREE.MeshBasicMaterial({color:0xffd700,transparent:true,opacity:0.9});
  const crown=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.16,0.16),crownM);
  crown.position.set(0,3.0,0.35); g.add(crown);
  const spike1=new THREE.Mesh(new THREE.ConeGeometry(.08,.3,6),crownM);spike1.position.set(-0.45,3.2,0.35);g.add(spike1);
  const spike2=new THREE.Mesh(new THREE.ConeGeometry(.08,.3,6),crownM);spike2.position.set(0,3.25,0.35);g.add(spike2);
  const spike3=new THREE.Mesh(new THREE.ConeGeometry(.08,.3,6),crownM);spike3.position.set(0.45,3.2,0.35);g.add(spike3);
  // 胸口能量核心
  const core=new THREE.Mesh(new THREE.SphereGeometry(.2,12,12),
    new THREE.MeshBasicMaterial({color:round%2?0xff3030:0xffd700}));
  core.position.set(0,1.5,0.9); g.add(core);
  // 双手
  const armM=new THREE.MeshStandardMaterial({color,roughness:.5});
  const a1=new THREE.Mesh(new THREE.BoxGeometry(.55,1.9,.55),armM);a1.position.set(-1.15,1.2,0);g.add(a1);
  const a2=a1.clone();a2.position.set(1.15,1.2,0);g.add(a2);
  // 爪子
  const clawM=new THREE.MeshStandardMaterial({color:0x2a1a1a,roughness:.6});
  [-1.15,1.15].forEach(x=>{

/* ============ 词汇题 ============ */
function pickWord(){
  const list=DATA[level]; let w=null;
  for(let i=0;i<list.length;i++){ const c=list[(Math.random()*list.length)|0]; if(!usedWords.has(c[0])){ w=c; break; } }
  if(!w){ usedWords.clear(); w=list[(Math.random()*list.length)|0]; }
  usedWords.add(w[0]); curWord=w;
}
function showQuestion(){
  pickWord();
  const [en,zh]=curWord;
  const showEn = Math.random()<0.5; // true:给英文选中文; false:给中文选英文
  const question = showEn?`指译：“${en}”`:`译回：“${zh}”`;
  const correct = showEn?zh:en;
  // 混淆项：从同等级随机抽含义
  const opts=[correct]; const pool=DATA[level].slice();
  while(opts.length<4){
    const c=pool[(Math.random()*pool.length)|0];
    const cand = showEn?c[1]:c[0];
    if(!opts.includes(cand)) opts.push(cand);
  }
  // 打乱
  for(let i=opts.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[opts[i],opts[j]]=[opts[j],opts[i]];}
  ui.innerHTML=`
    <div class="panel">
      <div class="sub">${level} · 第 ${P.round+1} 关词汇挑战</div>
      <div class="${showEn?'q-en':'q-zh'}">${showEn?en:zh}</div>
      <div class="sub" style="margin-bottom:8px">请选出它的${showEn?'中文意思':'英文拼写'}</div>
      <div id="opts"></div>
      <div class="hint" id="qhint"></div>
    </div>`;
  const box=ui.querySelector('#opts');
  opts.forEach(o=>{
    if(o===undefined||o===null) return;
    const b=el(`<button class="opt-btn">${o}</button>`);
    b.onclick=()=>answer(o,correct,b);
    box.appendChild(b);
  });
}
let answered=false;
function answer(choice, correct, btn){
  if(answered) return; answered=true;
  const ok = choice===correct;
  const qhint=ui.querySelector('#qhint'); const btns=ui.querySelectorAll('.opt-btn');
  btns.forEach(b=>{ b.style.pointerEvents='none'; if(b.textContent===correct) b.classList.add('correct'); });
  if(!ok) btn.classList.add('wrong');
  if(ok){ P.correct++; qhint.textContent='✔ 答对啦！请选择一项门之力加成'; }
  else   { P.wrong++;   qhint.textContent='✘ 答错了。正确是「'+correct+'」本轮无加成，战斗继续…'; }
  setTimeout(()=>{
    if(ok){ state='upgrade'; showUpgrade(); }
    else { enterBattle(); }
  }, 850);
}

/* ============ 战斗生成与关卡循环 ============ */
function enterBattle(){
  answered=false; curWord=null; state='battle';
  // 清理上一局
  clearEnemies();
  // 计算本关数值：小怪先逼近，BOSS在后，必须打得过但会掉一部分血
  const r = P.round;
  const minionCount = 3 + r;                                          // 每回合+1小怪
  const minionHP = Math.ceil(2 + P.weapon * 0.5);                     // 小怪血量随武器小幅增长
  const bossHP   = Math.ceil(5 + P.weapon * 1.5 + r * 2);             // BOSS血量随武器和回合增长
  const minionATK= 1;
  const bossATK  = 1 + Math.floor(r / 2);

  // 生成小怪：排在屏幕顶部同一z（同时逼近），x方向分散
  for(let i=0;i<minionCount;i++){
    const x = (i - (minionCount-1)/2) * 1.5;
    const m = buildMinion(CONFIG[level].color);
    m.position.set(x, 0, SPAWN_Z);
    scene.add(m);
    enemies.push({group:m, hp:minionHP, maxHp:minionHP, atk:minionATK,
                  speed:MINION_SPEED, type:'minion', alive:true, nextMelee:0});
  }
  // 生成BOSS：在小怪后方
  const bossMesh = buildMonster(CONFIG[level].color, r);
  bossMesh.position.set(0, 0, BOSS_SPAWN_Z);
  scene.add(bossMesh);
  enemies.push({group:bossMesh, hp:bossHP, maxHp:bossHP, atk:bossATK,
                speed:BOSS_SPEED, type:'boss', alive:true, nextMelee:0});

  doorGroup.visible=false;
  heroGroup.position.set(0,0.7,HERO_Z);
  setView();
  showBattle();
  battleBusy=true;
  heroNextAttack = performance.now() + 600;
  lastBattleTick = 0;
}
function showBattle(){
  const boss = enemies.find(e=>e.type==='boss');
  const name = weaponName(weaponLevel());
  ui.innerHTML=`
    <div class="bar-row top"><div class="bar-label">🛡 我方生命</div>
      <div class="bar hero"><i id="bhb"></i></div></div>
    <div class="bar-row bottom"><div class="bar-label">👾 BOSS HP</div>
      <div class="bar mon"><i id="mhb"></i></div></div>
    <div class="score-chip">第 ${P.round+1} 关 · ${name} Lv${weaponLevel()} · 攻速${heroAttackSpeedMult().toFixed(1)}× · 得分 ${P.score}</div>
    <div id="vsbar">
      <div class="vs-item">我方<br>攻击 <b id="pAtk">${P.weapon}</b></div>
      <span style="display:inline-block;width:30px"></span>
      <div class="vs-item mon">BOSS<br>攻击 <b id="mAtk">${boss?boss.atk:0}</b></div>
    </div>
    <div class="tip-bottom" id="btip">⚔ 小怪正在逼近…</div>`;
  updateBars();
}
function updateBars(){
  const bh=ui.querySelector('#bhb'); if(bh) bh.style.width=(Math.max(0,P.hp)/P.maxHp*100)+'%';
  const boss=enemies.find(e=>e.type==='boss');
  const mh=ui.querySelector('#mhb'); if(mh&&boss) mh.style.width=(Math.max(0,boss.hp)/boss.maxHp*100)+'%';
}
function findNearestEnemy(){
  let best=null, bestD=Infinity;
  for(const e of enemies){
    if(!e.alive) continue;
    const d = HERO_Z - e.group.position.z; // 越接近战士距离越小
    if(d < bestD){ bestD=d; best=e; }
  }
  return best;
}
function damageEnemy(e, dmg){
  e.hp -= dmg;
  floatText(e.group.position.clone().add(new THREE.Vector3(0, e.type==='boss'?2.6:1.6, 0)), '-'+dmg, '#ffd27a');
  flashMesh(e.group);
  if(e.hp<=0){
    e.alive=false;
    e.group.visible=false;
    burstAt(e.group.position.clone(), e.type==='boss'?45:25, e.type==='boss');
    if(e.type==='boss'){ winBurst(); screenShake(0.25); }
    else { screenShake(0.08); }
  }
}
// 3D 死亡爆发粒子（在怪死亡处原地喷发）
function burstAt(center, n, big){
  const cols = big ? [0xffd700,0xffae00,0xff7a7a,0xc084fc,0xffffff] : [0x5eead4,0x8b7bff,0xff7a7a,0xffd27a];
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(big?0.08:0.06,6,6),
      new THREE.MeshBasicMaterial({color:cols[(Math.random()*cols.length)|0],transparent:true,opacity:.95}));
    m.position.copy(center);
    const ang=Math.random()*Math.PI*2, up=Math.random()*Math.PI;
    const spd=(big?3:2)+Math.random()*(big?4:3);
    burstPool.push({m, vx:Math.sin(up)*Math.cos(ang)*spd, vy:Math.cos(up)*spd+1, vz:Math.sin(up)*Math.sin(ang)*spd, life:1});
    scene.add(m);
  }
}
function battleTick(now){
  if(!battleBusy) return;
  const dt = lastBattleTick ? Math.min(0.05, (now-lastBattleTick)/1000) : 0.016;
  lastBattleTick = now;
  // 战士自动攻击最近的敌人
  if(now >= heroNextAttack){
    const target = findNearestEnemy();
    if(target){
      punch(heroGroup.position.clone().add(new THREE.Vector3(0,2.2,0)),
            target.group.position.clone().add(new THREE.Vector3(0, target.type==='boss'?2:1, 0)), 180, null);
      damageEnemy(target, P.weapon);
      updateBars();
    }
    heroNextAttack = now + heroAttackInterval()*1000;
  }
  // 怪物移动 & 近战
  for(const e of enemies){
    if(!e.alive) continue;
    const dist = HERO_Z - e.group.position.z;
    if(dist > CONTACT_DIST){
      // 还没碰到，继续逼近
      e.group.position.z += e.speed * dt;
    } else {
      // 已接触战士，近战攻击
      if(now >= e.nextMelee){
        e.nextMelee = now + MELEE_INTERVAL*1000;
        P.hp = Math.max(0, P.hp - e.atk);
        flashHero(); damageFlash(); screenShake(0.22);
        floatText(heroGroup.position.clone().add(new THREE.Vector3(0,2.8,0)), '-'+e.atk, '#ff7a7a');
        updateBars();
        if(P.hp<=0){ endCombat(false); return; }
      }
    }
  }
  // 检查胜利：所有敌人死亡
  if(enemies.every(e=>!e.alive)){ endCombat(true); }
}
function clearEnemies(){
  for(const e of enemies){ if(e.group){ scene.remove(e.group); disposeGroup(e.group); } }
  enemies = [];
}
function endCombat(won){
  battleBusy=false;
  if(won){
    P.score += 100 + P.hp*10;
    P.round++;
    P.hp = Math.min(P.maxHp, P.hp + HEAL_PER_WIN);
    setTimeout(()=>completeStage(), 700);
  } else {
    setTimeout(()=>gameOver(), 700);
  }
}
function completeStage(){
  clearEnemies();
  heroGroup.position.set(0,0.7,HERO_Z);
  state='question';
  showQuestion();
}
function gameOver(){
  clearEnemies();
  state='menu';
  ui.innerHTML=`
    <div class="panel">
      <h1 class="title">挑战结束</h1>
      <div class="sub">${level} · 闯到第 ${P.round+1} 关</div>
      <div class="big-num">${P.score}</div>
      <div class="sub">答对 ${P.correct} 题 · 答错 ${P.wrong} 题</div>
      <div class="btn-row">
        <button class="btn-ghost" onclick="location.reload()">回主菜单</button>
        <button class="btn-main" id="retry">再来一局</button>
      </div>
    </div>`;
  ui.querySelector('#retry').onclick=()=>startRun(level);
}

/* ============ 工具函数 ============ */
function disposeGroup(o){ o.traverse(c=>{ if(c.geometry)c.geometry.dispose(); if(c.material)Array.isArray(c.material)?c.material.forEach(m=>m.dispose()):c.material.dispose(); }); }
function removeMonster(){ if(monsterGroup){ scene.remove(monsterGroup); disposeGroup(monsterGroup); monsterGroup=null; } }
function flashMonster(){ flashMesh(monsterGroup); }
function flashHero(){ flashMesh(heroGroup); }
function flashMesh(root){
  if(!root) return;
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(1.25, 12, 12),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.45})
  );
  shell.position.set(0, 1.7, 0); root.add(shell);
  setTimeout(()=>{ root.remove(shell); shell.geometry.dispose(); shell.material.dispose(); }, 200);
}
/* 打击特效：进projs，在渲染主循环里更新，不依赖游离的rAF */
const projs=[];
function punch(from,to,dur,cb){
  const lv = weaponLevel();
  const center = to.clone().add(from).multiplyScalar(0.5);
  const dir = to.clone().sub(from).normalize();
  // 同色发光斩击波束（武士刀挥砍感）
  const dotColor = weaponColor(lv);
  const beamLen = 0.8 + lv*0.35;                 // 波束长度随等级变长
  const beamThick = 0.1 + lv*0.04;               // 波束粗细随等级变粗
  const beam = new THREE.Mesh(
    new THREE.ConeGeometry(beamThick, beamLen, 6, 1),
    new THREE.MeshBasicMaterial({color:dotColor, transparent:true, opacity:0.5})
  );
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  beam.position.copy(center);
  scene.add(beam);
  projs.push({m:beam, from:center.clone(), to:center.clone(), t0:performance.now(), dur:dur*0.6});
  // 额外尾迹粒子
  const trailCount = Math.min(2 + lv, 8);
  for(let i=0;i<trailCount;i++){
    const offset = new THREE.Vector3(
      (Math.random()-0.5)*0.6,
      (Math.random()-0.5)*0.6,
      (Math.random()-0.5)*0.6
    );
    const dot=new THREE.Mesh(
      new THREE.SphereGeometry(0.06+lv*0.04, 6, 6),
      new THREE.MeshBasicMaterial({color:dotColor, transparent:true, opacity:0.85})
    );
    dot.position.copy(center).add(offset);
    scene.add(dot);
    projs.push({m:dot, from:center.clone().add(offset),
                to:center.clone().add(offset.clone().multiplyScalar(1.6)),
                t0:performance.now(), dur});
  }
  if(typeof cb==='function') setTimeout(cb, dur);
}
function updateProjs(){
  const now=performance.now();
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i]; const k=Math.min(1,(now-p.t0)/p.dur);
    p.m.position.lerpVectors(p.from,p.to,k);
    if(k>=1){ scene.remove(p.m); p.m.geometry.dispose(); p.m.material.dispose(); projs.splice(i,1); }
  }
}
function floatText(world, txt, color){
  if(typeof color==='number') color='#'+color.toString(16).padStart(6,'0');
  const v=world.clone().project(camera);
  const x=(v.x*0.5+0.5)*innerWidth, y=(-v.y*0.5+0.5)*innerHeight;
  // 伤害数字大小随武器等级增长
  const lv = weaponLevel();
  const fontSize = 16 + lv * 3;
  const fontWeight = 600 + Math.min(lv, 3) * 100;
  const d=el(`<div class="float dmg" style="left:${x}px;top:${y}px;color:${color};font-size:${fontSize}px;font-weight:${fontWeight}">${txt}</div>`);
  ui.appendChild(d); setTimeout(()=>d.remove(),1100);
}
/* 门粒子爆发 */
function doorBurst(){
  const center=doorGroup.position.clone();
  for(let i=0;i<40;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),
      new THREE.MeshBasicMaterial({color:i%2?0x8b7bff:0x5eead4,transparent:true,opacity:.9}));
    m.position.copy(center);
    const ang=Math.random()*Math.PI*2, up=Math.random()*2;
    const spd=2+Math.random()*4;
    burstPool.push({m, vx:Math.cos(ang)*spd, vy:up*spd, vz:Math.sin(ang)*spd, life:1});
    scene.add(m);
  }
}
function updateBurst(dt){
  for(let i=burstPool.length-1;i>=0;i--){
    const b=burstPool[i];
    b.m.position.x+=b.vx*dt; b.m.position.y+=b.vy*dt; b.m.position.z+=b.vz*dt;
    b.vy-=3*dt; b.life-=dt*1.5;
    b.m.material.opacity=Math.max(0,b.life); b.m.scale.setScalar(Math.max(0.1,b.life));
    if(b.life<=0){ scene.remove(b.m); b.m.geometry.dispose(); b.m.material.dispose(); burstPool.splice(i,1); }
  }
}
/* 屏幕震动 */
let shakeT=0, shakeMag=0;
function screenShake(mag){ shakeT=0.4; shakeMag=mag; }
/* 伤害红闪 */
const dmgFlash=document.getElementById('damageFlash');
function damageFlash(){
  dmgFlash.classList.add('active');
  setTimeout(()=>dmgFlash.classList.remove('active'),180);
}
/* 胜利金色粒子爆发 */
function winBurst(){
  const c=document.createElement('div'); c.className='win-burst';
  const colors=['#ffd700','#ffae00','#5eead4','#8b7bff','#fff'];
  for(let i=0;i<50;i++){
    const s=document.createElement('i');
    const ang=Math.random()*Math.PI*2, dist=100+Math.random()*300;
    s.style.left='50%'; s.style.top='50%';
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    s.style.background=colors[(Math.random()*colors.length)|0];
    s.style.animationDelay=(Math.random()*0.3)+'s';
    s.style.boxShadow='0 0 8px '+s.style.background;
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),1600);
}

/* ============ 主循环 ============ */
let lastT=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  const t=now*0.001;
  // 粒子旋转漂浮
  pts.rotation.y=t*0.05;
  // 环绕武器旋转
  updateOrbitWeapons(t);
  // 战士待机呼吸起伏（战斗时更活跃）
  if(state==='battle'){
    heroGroup.position.y = 0.7 + Math.sin(t*2.5)*0.04;
  } else {
    heroGroup.position.y = 0.7 + Math.sin(t*1.8)*0.02;
  }
  // 怪物待机动画
  if(state==='battle'){
    for(const e of enemies){
      if(!e.alive||!e.group) continue;
      e.group.rotation.y=Math.sin(t*2 + e.group.position.x)*0.1;
      e.group.position.y=Math.sin(t*3 + e.group.position.x)*0.04;
    }
  }
  // 屏幕震动
  if(shakeT>0){
    shakeT-=dt;
    const m=shakeMag*(shakeT/0.4);
    camera.position.x=camBase.x+(Math.random()-0.5)*m*2;
    camera.position.y=camBase.y+(Math.random()-0.5)*m*2;
  }
  if(state==='battle' && battleBusy) battleTick(now);
  updateBurst(dt);
  updateProjs();
  renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
renderer.setSize(innerWidth,innerHeight);

// 初始显示主菜单
state='menu'; showMenu();
updateHeroWeapon();
animate();
</script>
