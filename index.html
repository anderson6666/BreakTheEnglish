/* 打击特效：进projs，在渲染主循环里更新，不依赖游离的rAF */
const projs=[];
function punch(from,to,dur,cb){
  const lv = weaponLevel();
  const center = to.clone().add(from).multiplyScalar(0.5);
  const dir = to.clone().sub(from).normalize();
  // 同色发光斩击波束（武士刀挥砍感）
  const dotColor = weaponColor(lv);
  const beamLen = 0.8 + lv*0.35;                 // 波束长度随等级变长
  const beamThick = 0.1 + lv*0.04;               // 波束粗细随等级变粗
  const beam = new THREE.Mesh(
    new THREE.ConeGeometry(beamThick, beamLen, 6, 1),
    new THREE.MeshBasicMaterial({color:dotColor, transparent:true, opacity:0.5})
  );
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  beam.position.copy(center);
  scene.add(beam);
  projs.push({m:beam, from:center.clone(), to:center.clone(), t0:performance.now(), dur:dur*0.6});
  // 额外尾迹粒子
  const trailCount = Math.min(2 + lv, 8);
  for(let i=0;i<trailCount;i++){
    const offset = new THREE.Vector3(
      (Math.random()-0.5)*0.6,
      (Math.random()-0.5)*0.6,
      (Math.random()-0.5)*0.6
    );
    const dot=new THREE.Mesh(
      new THREE.SphereGeometry(0.06+lv*0.04, 6, 6),
      new THREE.MeshBasicMaterial({color:dotColor, transparent:true, opacity:0.85})
    );
    dot.position.copy(center).add(offset);
    scene.add(dot);
    projs.push({m:dot, from:center.clone().add(offset),
                to:center.clone().add(offset.clone().multiplyScalar(1.6)),
                t0:performance.now(), dur});
  }
  if(typeof cb==='function') setTimeout(cb, dur);
}
function updateProjs(){
  const now=performance.now();
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i]; const k=Math.min(1,(now-p.t0)/p.dur);
    p.m.position.lerpVectors(p.from,p.to,k);
    if(p.spinC) p.m.rotation.z = k*p.spinC*Math.PI*2;   // 飞刀飞行旋转
    if(k>=1){ scene.remove(p.m); disposeGroup(p.m); projs.splice(i,1); }
  }
}
// 飞刀出鞘：一把旋转的飞刀从战士双掌间射向敌方
function throwKnife(from,to,dur){
  // 极端攻速保护：限制同时在场的飞刀数量，避免刷满特效
  let active=0; for(const pp of projs) if(pp.knife) active++;
  if(active>=5) return;
  const lv=weaponLevel(), color=weaponColor(lv);
  const knife=makeSword(0.5+lv*0.06, color, Math.min(0.5,0.22+lv*0.12));
  const dir=to.clone().sub(from); dir.normalize();
  knife.position.copy(from);
  knife.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  scene.add(knife);
  projs.push({knife:true, m:knife, from:from.clone(), to:to.clone(), t0:performance.now(), dur, spinC:3+Math.min(lv,6)});
}
function floatText(world, txt, color){
  if(typeof color==='number') color='#'+color.toString(16).padStart(6,'0');
  const v=world.clone().project(camera);
  const vs=viewSize();
  const x=((v.x*0.5+0.5)*vs.w)/UIZ, y=((-v.y*0.5+0.5)*vs.h)/UIZ;   // 画面框像素→#ui 坐标(除以缩放)
  // 伤害数字大小随武器等级增长
  const lv = weaponLevel();
  const fontSize = 16 + lv * 3;
  const fontWeight = 600 + Math.min(lv, 3) * 100;
  const d=el(`<div class="float dmg" style="left:${x}px;top:${y}px;color:${color};font-size:${fontSize}px;font-weight:${fontWeight}">${txt}</div>`);
  ui.appendChild(d); setTimeout(()=>d.remove(),1100);
}
/* 门粒子爆发 */
function doorBurst(){
  const center=doorGroup.position.clone();
  for(let i=0;i<40;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),
      new THREE.MeshBasicMaterial({color:i%2?0x3fae5a:0xffd27a,transparent:true,opacity:.9}));
    m.position.copy(center);
    const ang=Math.random()*Math.PI*2, up=Math.random()*2;
    const spd=2+Math.random()*4;
    burstPool.push({m, vx:Math.cos(ang)*spd, vy:up*spd, vz:Math.sin(ang)*spd, life:1});
    scene.add(m);
  }
}
function updateBurst(dt){
  for(let i=burstPool.length-1;i>=0;i--){
    const b=burstPool[i];
    if(b.ring){
      // 冲击波圆环：向外扩散并淡出
      b.life-=dt*2.4;
      const k=1-Math.max(0,b.life);
      b.m.scale.setScalar(.4+k*b.maxR);
      b.m.material.opacity=Math.max(0,b.life)*.85;
      if(b.life<=0){ scene.remove(b.m); b.m.geometry.dispose(); b.m.material.dispose(); burstPool.splice(i,1); }
      continue;
    }
    b.m.position.x+=b.vx*dt; b.m.position.y+=b.vy*dt; b.m.position.z+=b.vz*dt;
    b.vy-=3*dt; b.life-=dt*1.5;
    b.m.material.opacity=Math.max(0,b.life); b.m.scale.setScalar(Math.max(0.1,b.life));
    if(b.life<=0){ scene.remove(b.m); b.m.geometry.dispose(); b.m.material.dispose(); burstPool.splice(i,1); }
  }
}
/* 屏幕震动 */
let shakeT=0, shakeMag=0;
function screenShake(mag){ shakeT=0.4; shakeMag=mag; }
/* 伤害红闪 */
const dmgFlash=document.getElementById('damageFlash');
function damageFlash(){
  dmgFlash.classList.add('active');
  setTimeout(()=>dmgFlash.classList.remove('active'),180);
}
/* 胜利金色粒子爆发 */
function winBurst(){
  const c=document.createElement('div'); c.className='win-burst';
  const colors=['#2e8b57','#3fae5a','#d48806','#e07856','#7cc97f'];
  for(let i=0;i<50;i++){
    const s=document.createElement('i');
    const ang=Math.random()*Math.PI*2, dist=100+Math.random()*300;
    s.style.left='50%'; s.style.top='50%';
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    s.style.background=colors[(Math.random()*colors.length)|0];
    s.style.animationDelay=(Math.random()*0.3)+'s';
    s.style.boxShadow='0 0 8px '+s.style.background;
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),1600);
}

/* ============ 卡牌彩色弹幕：从左侧滑向右侧，循环飞过战士身后 ============ */
const CARD_RUSH_COLORS=['#ff5d8f','#ffd166','#4cc9f0','#7b61ff','#3fae5a','#ff9f1c','#00d4b3','#ff4d6d'];
let cardRushState=null;
function cardRushBurst(){
  if(cardRushState && cardRushState.meshes.length){  // 已有弹幕正在播放则继续计时
    cardRushState.t0=performance.now(); return;
  }
  const grp=new THREE.Group();
  const geos=[], mats=[];
  const N=15;
  for(let i=0;i<N;i++){
    const hex=CARD_RUSH_COLORS[(Math.random()*CARD_RUSH_COLORS.length)|0];
    const geo=new THREE.BoxGeometry(0.62,0.88,0.10);
    const col=new THREE.Color(hex);
    const mat=new THREE.MeshStandardMaterial({color:0xffffff, emissive:col,
      emissiveIntensity:0.55, roughness:0.35, metalness:0.15});
    const face=new THREE.MeshBasicMaterial({color:col});
    const m=new THREE.Mesh(geo,[mat,mat,mat,mat,face,mat]);
    m.position.set(-11.5-Math.random()*2, 0.4+Math.random()*2.2, -1.6+Math.random()*3.2);
    m.rotation.set((Math.random()-.5)*.2,(Math.random()-.5)*.5,(Math.random()-.5)*.2);
    m.userData={speed:5.2+Math.random()*4.2, spin:(Math.random()-.5)*.9, bob:Math.random()*6.28, born:performance.now()};
    grp.add(m); geos.push(geo); mats.push(mat,face);
  }
  scene.add(grp);
  cardRushState={grp, meshes:[...grp.children], geos, mats,
    t0:performance.now()+400, life:7.0};
}
function updateCards(dt, now){
  const cs=cardRushState; if(!cs) return;
  const el=(now-cs.t0)/1000;
  if(el>cs.life+0.9){
    scene.remove(cs.grp);
    cs.geos.forEach(g=>g.dispose()); cs.mats.forEach(m=>m.dispose());
    cardRushState=null; return;
  }
  const fade = el>cs.life ? 1-(el-cs.life)/0.9 : 1;   // 收尾淡出
  const t=now*0.001;
  for(let k=0;k<cs.meshes.length;k++){
    const m=cs.meshes[k], u=m.userData;
    const sp = k%2===0 ? 1 : 0.75;                    // 快慢交错更像弹幕
    m.position.x += u.speed*sp*dt;
    m.rotation.z += u.spin*dt;
    m.position.y += Math.sin(t*2.2+u.bob)*0.02;
    if(m.position.x>12.5){                            // 循环：回落到最左侧
      m.position.x=-12.5-Math.random()*2;
      u.speed=5.2+Math.random()*4.2;
    }
    m.scale.setScalar(Math.max(0,fade));
  }
}
/* ============ 主循环 ============ */
let lastT=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  const t=now*0.001;
  // 粒子旋转漂浮
  pts.rotation.y=t*0.05;
  // 环绕武器旋转
  updateOrbitWeapons(t);
  // 战士待机呼吸起伏（战斗时更活跃）；失败CG时播放倒地动画
  if(state==='failcg'){
    if(failFallT0){                     // 向后倾倒+下沉，缓动1.1秒后定格
      const k=Math.min(1,(now-failFallT0)/1100);
      const e=1-Math.pow(1-k,3);
      heroGroup.rotation.x=-1.45*e;
      heroGroup.position.y=Math.max(.1,.7-.58*e);
      if(k>=1) failFallT0=0;
    }
  } else if(state==='battle'){
    heroGroup.position.y = 0.7 + Math.sin(t*2.5)*0.04;
  } else {
    heroGroup.position.y = 0.7 + Math.sin(t*1.8)*0.02;
  }
  // 战士「双手念诀」施法动画：双掌身前结印 → 能量球凝聚 → 飞刀出手 → 收势
  const easeIO=(x)=>x*x*(3-2*x);
  const cc=(now-heroCastT)/330;
  if(cc>=0 && cc<1){
    const arr = cc<0.24 ? easeIO(cc/0.24) : (cc<0.62 ? 1 : 1-easeIO((cc-0.62)/0.38));
    heroGroup.armL.rotation.set(2.05*arr, 0, 0.42*arr);
    heroGroup.armR.rotation.set(2.05*arr, 0, -0.42*arr);
    heroGroup.castOrb.visible=true; heroGroup.castOrb.rotation.y=cc*9;
    heroGroup.castOrb.scale.setScalar(0.02 + 0.62*Math.sin(Math.min(1,cc/0.42)*Math.PI));
    const thrust = cc<0.42 ? 0 : Math.sin(Math.min(1,(cc-0.42)/0.30)*Math.PI);
    heroGroup.position.z = HERO_Z - 0.4*thrust;
  } else {
    heroGroup.armL.rotation.set(0,0,0); heroGroup.armR.rotation.set(0,0,0);
    heroGroup.castOrb.visible=false; heroGroup.castOrb.scale.setScalar(0.001);
    heroGroup.position.z = HERO_Z;
  }
  // 披风飘动（战斗时更剧烈）
  if(heroGroup.cape) heroGroup.cape.rotation.x=0.14+Math.sin(t*2.3)*0.07+(state==='battle'?0.2+Math.sin(t*9)*0.05:0);
  // 漂浮碎石升降与自转
  for(const r of floatRocks){ r.m.position.y=r.y0+Math.sin(t*0.7+r.ph)*0.35; r.m.rotation.y+=r.spin*dt; }
  // 怪物动画：出生缩放 + 待机 + 翅膀扇动 + BOSS核心脉动/碎晶环绕
  if(state==='battle'){
    for(const e of enemies){
      if(!e.alive||!e.group) continue;
      const ud=e.group.userData||{};
      if(e.spawnAt){
        const k=Math.min(1,(now-e.spawnAt)/350);
        const s=(ud.baseScale||1)*(0.05+0.95*(1-Math.pow(1-k,2)));
        e.group.scale.setScalar(k<1?s:(ud.baseScale||1));
      }
      // —— 怪物步态：清晰迈步起伏 + 左右摇摆 + 前倾俯仰；叠加受伤后仰/进攻前扑 ——
      const hr = hurtW(now,e), atkK = atkW(now,e);
      const isBoss = e.type==='boss';
      const moving = e.group.position.z < HERO_Z - CONTACT_DIST - 0.05;
      const stepPh = t*(isBoss?5.5:13) + e.homeX*3 + (ud.ph||0);
      // 迈步起伏：小怪蹦跳式大起伏，BOSS 沉重但明显地下压→弹起
      const st = moving ? Math.abs(Math.sin(stepPh)) : 0.04;
      const bob = isBoss ? 0.18*st : 0.36*st;
      // 迈步左右摇摆（模拟交替踏脚，走路感更足）
      const sway = moving ? Math.sin(stepPh)*0.20 : Math.sin(t*1.2)*0.05;
      // 前进整体前倾 + 随步伐轻微俯仰
      let tx = 0.10 + Math.sin(stepPh*0.5)*0.08 + (moving?0.14:0);
      tx += atkK*0.5 - hr*0.40;                                     // 进攻压身前扑 / 受伤后仰
      const atkHop = atkK>0 ? Math.sin(atkK*Math.PI)*0.14 : 0;      // 进攻腾跃着地
      e.group.rotation.y = Math.sin(t*2 + e.group.position.x)*0.1;
      e.group.rotation.x = tx;
      e.group.rotation.z = sway;                                     // 步伐左右摆
      e.group.position.y = Math.sin(t*3 + e.group.position.x)*0.04 + bob - atkHop + hr*0.06;
      if(ud.wings) ud.wings.forEach((w,i)=>{ w.rotation.y=w.userData.side*(.35+Math.sin(t*(ud.wingSpd||13)+ud.ph+i)*(ud.wingAmp||.4)+atkK); });
      if(ud.core){
        ud.core.scale.setScalar(1+Math.sin(t*4+ud.ph)*.18);
        ud.coreRing.rotation.z=t*2.2;
        ud.light.intensity=1.1+Math.sin(t*4+ud.ph)*.4;
        ud.shards.rotation.y=t*1.15;
      }
    }
  }
  // 屏幕震动
  if(shakeT>0){
    shakeT-=dt;
    const m=shakeMag*(shakeT/0.4);
    camera.position.x=camBase.x+(Math.random()-0.5)*m*2;
    camera.position.y=camBase.y+(Math.random()-0.5)*m*2;
  }
  updateDayNight(now,dt);          // 昼夜循环全局播放：主菜单+游戏内都是落日→月升
  updateMenu3D(dt, now, t);   // 主菜单：3D拨盘 + 运镜
  if(state==='battle' && battleBusy) battleTick(now);
  updateBurst(dt);
  updateCards(dt, now);
  updateProjs();
  renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
  applyRot();                                            // 旋转态尺寸随窗口像素重算
  const v = viewSize();                                 // 手机竖屏旋转时宽高互换
  camera.aspect = v.w/v.h; camera.updateProjectionMatrix();
  renderer.setSize(v.w, v.h);
});
renderer.setSize(viewSize().w, viewSize().h);

// 初始显示主菜单
state='menu'; showMenu();
updateHeroWeapon();
// 首次用户交互时解锁音频上下文（浏览器策略限制）
window.addEventListener('pointerdown',()=>{ Sfx.init(); }, {once:true});
animate();
</script>
