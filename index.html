<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>勇者之路</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Ccircle cx='48' cy='48' r='44' fill='%23fdfaf1' stroke='%233fae5a' stroke-width='5'/%3E%3Cpath d='M26 62 Q40 56 48 62 Q56 56 70 62 L70 50 Q56 44 48 50 Q40 44 26 50 Z' fill='%237cc97f' stroke='%232e8b57' stroke-width='2.5'/%3E%3Cpath d='M48 14 L54 26 L54 52 L48 58 L42 52 L42 26 Z' fill='%23ffd27a' stroke='%23d48806' stroke-width='2.5'/%3E%3Crect x='34' y='52' width='28' height='6' rx='3' fill='%23d48806'/%3E%3Crect x='44.5' y='58' width='7' height='14' rx='3' fill='%236b4a2f'/%3E%3Ccircle cx='48' cy='74' r='4.5' fill='%23ffd27a'/%3E%3C/svg%3E">
<style>
  :root{
    --accent:#3fae5a; --accent2:#2e8b57;
    --danger:#f87171; --ok:#2e9e57;
    --paper:#fdfaf1; --ink:#33322a;
  }
  *{box-sizing:border-box; margin:0; padding:0; user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;
    background:radial-gradient(1200px 800px at 50% -10%,#fdf9ee 0%,#f4ecd6 55%,#e9dfc6 100%);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);}
  /* 背景粒子层（淡绿纸屑） */
  #bgParticles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  #bgParticles span{position:absolute;width:3px;height:3px;border-radius:50%;background:#a8c99a;opacity:.35;
    animation:floatP linear infinite;}
  @keyframes floatP{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-110vh) translateX(20px);opacity:0}}
  #app{position:fixed;inset:0;z-index:1;container-type:size;}  /* UI 尺寸用 cqw/cqh 跟随本框，而非手机屏幕 vw/vh */
  /* 竖屏旋转态：画面16:9居中后，屏幕上下多出的条带用动态幻彩流光填充（--gap 高度由 applyRot 注入） */
  #rotFill{display:none;position:fixed;inset:0;z-index:0;pointer-events:none;--gap:0px;}
  #rotFill::before,#rotFill::after{content:'';position:absolute;left:0;right:0;height:var(--gap);
    background:linear-gradient(90deg,#ff6ec4,#ffc3a0,#a18cd1,#84fab0,#8fd3f4,#c2e9fb,#ff9a9e,#ff6ec4);
    background-size:200% 100%;
    animation:rotIrid 14s linear infinite,rotHue 9s linear infinite;opacity:.95;}
  #rotFill::before{top:0;}
  #rotFill::after{bottom:0;}
  @keyframes rotIrid{from{background-position:0% 0}to{background-position:-200% 0}}
  @keyframes rotHue{from{filter:hue-rotate(0deg) saturate(1.35)}to{filter:hue-rotate(360deg) saturate(1.35)}}
  /* 手机竖屏：整个游戏旋转90度，画面始终为横屏体验（横放手机时不旋转）。
     UI 不单独改样式：整个 #ui 层由 applyUIScale() 等比缩放，与桌面完全同布局、同比例 */
  @media (orientation:portrait) and (pointer:coarse){
    #app{transform-origin:left top;transform:rotate(90deg);}  /* 尺寸由 applyRot() 按像素设置，避开移动端 100vh 含地址栏的偏差 */
  }
  /* 横屏手机不旋转：UI 等比缩放同样由 applyUIScale() 处理，无需单独规则 */
  #game{position:absolute;inset:0;display:block;touch-action:none;}
  /* 覆盖 UI */
  #ui{position:absolute;inset:0;pointer-events:none;}
  .panel{position:absolute;left:0;right:0;top:0;bottom:0;margin:auto;width:min(92%,460px);
    background:rgba(253,250,241,.92);border:1px solid rgba(63,174,90,.4);border-radius:18px;
    padding:26px;text-align:center;backdrop-filter:blur(12px);max-height:92%;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
    box-shadow:0 0 40px rgba(63,174,90,.12),0 18px 60px rgba(90,80,50,.28);
    pointer-events:auto;animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
  .panel::-webkit-scrollbar{width:16px;height:16px}
  .panel::-webkit-scrollbar-track{background:rgba(63,174,90,.08);border-radius:10px}
  .panel::-webkit-scrollbar-thumb{background:rgba(63,174,90,.55);border:3px solid rgba(253,250,241,.92);border-radius:10px;min-height:44px;min-width:44px}
  .panel::-webkit-scrollbar-thumb:hover{background:rgba(63,174,90,.8)}
  .panel{scrollbar-width:auto;scrollbar-color:rgba(63,174,90,.55) rgba(63,174,90,.08);}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  /* ============ 主菜单：战士居中 + 环绕拨盘选科 ============ */
  .home{position:absolute;inset:0;pointer-events:none;
    display:flex;flex-direction:column;align-items:stretch;}
  .home .home-top{position:relative;padding:10px 16px 2px;text-align:center;z-index:3;}
  .home .home-top .title{font-size:26px;margin:0 0 2px;}
  .home .home-top .sub{margin:0 0 6px;}
  .home .pf-bar{justify-content:center;}
  .home .bonus-row{margin:0;text-align:center;}
  .home-radial{position:relative;width:min(96%,430px);flex:1 1 auto;min-height:140px;
    margin:0 auto;pointer-events:none;}

  .home-mini{position:relative;margin-top:auto;padding:8px 14px 16px;display:flex;
    justify-content:center;gap:8px;flex-wrap:wrap;z-index:3;pointer-events:auto;}
  #ui.hidden, .hidden{display:none!important;}
  h1.title{font-size:30px;letter-spacing:3px;
    background:linear-gradient(90deg,var(--accent),#7cc97f,var(--accent));
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:8px;animation:shine 3s linear infinite;text-shadow:0 0 30px rgba(46,139,87,.3);}
  @keyframes shine{to{background-position:200% center}}
  .sub{font-size:13px;opacity:.72;margin-bottom:20px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .lvl-btn,.opt-btn,.act-btn,.upgrade-btn{
    background:linear-gradient(180deg,rgba(63,174,90,.14),rgba(63,174,90,.04));
    border:1px solid rgba(63,174,90,.4);color:var(--ink);border-radius:12px;padding:14px 10px;cursor:pointer;
    font-size:15px;transition:.2s;width:100%;position:relative;overflow:hidden;}
  .lvl-btn::before,.opt-btn::before,.upgrade-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transition:.5s;}
  .lvl-btn:hover::before,.opt-btn:hover::before,.upgrade-btn:hover::before{left:100%}
  .lvl-btn:hover,.opt-btn:hover,.upgrade-btn:hover,.act-btn:hover{
    background:rgba(63,174,90,.22);transform:translateY(-2px);
    box-shadow:0 0 20px rgba(63,174,90,.35);}
  .lvl-btn b{display:block;font-size:17px;margin-bottom:2px;}
  .lvl-btn small{opacity:.65;font-weight:400;font-size:11px;}
  .lvl-btn.sel{outline:2px solid var(--accent);box-shadow:0 0 25px rgba(63,174,90,.4);}
  /* 精美徽标图标（剑与魔法书） */
  .logo-wrap{width:112px;height:112px;margin:0 auto 10px;
    filter:drop-shadow(0 6px 14px rgba(63,174,90,.35));animation:logoFloat 3s ease-in-out infinite;}
  .logo-wrap svg{width:100%;height:100%;display:block;}
  @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .load-btn{position:relative;overflow:hidden;background:rgba(63,174,90,.14);border:1px solid rgba(63,174,90,.55);
    color:#2e5c40;padding:9px 18px;border-radius:20px;font-size:14px;cursor:pointer;backdrop-filter:blur(6px);
    margin-top:14px;transition:.2s;}
  .load-btn:hover{background:rgba(63,174,90,.28);box-shadow:0 0 18px rgba(63,174,90,.4);}
  .save-overlay{position:absolute;inset:0;z-index:998;background:rgba(58,58,46,.35);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:auto;}
  .save-box{width:min(460px,92%);max-height:78%;overflow:auto;background:rgba(253,250,241,.97);
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    border:1px solid rgba(63,174,90,.4);border-radius:18px;padding:22px;box-shadow:0 0 40px rgba(63,174,90,.18);}
  .save-box h2{margin:0 0 6px;color:var(--accent2);text-shadow:0 0 12px rgba(63,174,90,.3);}
  .save-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .save-item{display:flex;justify-content:space-between;align-items:center;background:rgba(63,174,90,.08);
    border:1px solid rgba(63,174,90,.25);border-radius:12px;padding:12px 14px;margin-bottom:10px;
    cursor:pointer;transition:.2s;text-align:left;pointer-events:auto;}
  .save-item:hover{border-color:var(--accent);box-shadow:0 0 14px rgba(63,174,90,.3);transform:translateY(-1px);}
  .save-item .nm{font-weight:700;font-size:16px;pointer-events:none;}
  .save-item .dt{font-size:12px;opacity:.7;margin-top:3px;pointer-events:none;}
  .save-item .del{background:none;border:none;color:#e05d5d;font-size:18px;cursor:pointer;padding:0 4px;flex-shrink:0;pointer-events:auto;}
  .save-new{width:100%;background:linear-gradient(90deg,#3fae5a,#2e8b57);border:none;color:#fff;padding:12px;
    border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;pointer-events:auto;}
  .save-new:hover{box-shadow:0 0 18px rgba(46,139,87,.5);}
  .q-en{font-size:34px;font-weight:700;margin-bottom:6px;letter-spacing:1px;
    text-shadow:0 0 20px rgba(63,174,90,.25);}
  .q-zh{font-size:26px;font-weight:600;margin-bottom:18px;color:var(--accent2);
    text-shadow:0 0 15px rgba(63,174,90,.2);}
  .opt-btn{margin-top:8px;text-align:left;font-size:16px;}
  .opt-btn.correct{background:linear-gradient(90deg,#34d399,#10b981);border-color:var(--ok);color:#06281c;
    box-shadow:0 0 25px rgba(52,211,153,.6);animation:corrShake .3s;}
  .opt-btn.wrong{background:linear-gradient(90deg,#f87171,#ef4444);border-color:var(--danger);
    box-shadow:0 0 25px rgba(248,113,113,.6);animation:wrongShake .3s;}
  @keyframes corrShake{0%,100%{transform:translateX(0)}50%{transform:scale(1.03)}}
  @keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .hint{font-size:13px;margin-top:12px;opacity:.9;min-height:18px;}
  .upgrade-btn{border-radius:16px;padding:20px 12px;font-size:18px;font-weight:600;}
  .upgrade-btn u{display:block;font-size:12px;opacity:.8;margin-top:6px;text-decoration:none;}
  .upgrade-btn.w2{background:linear-gradient(180deg,rgba(248,113,113,.3),rgba(248,113,113,.08));border-color:#f87171;}
  .upgrade-btn.w2:hover{box-shadow:0 0 30px rgba(248,113,113,.6)}
  .upgrade-btn.ammo{background:linear-gradient(180deg,rgba(52,211,153,.3),rgba(52,211,153,.08));border-color:#34d399;}
  .upgrade-btn.ammo:hover{box-shadow:0 0 30px rgba(52,211,153,.6)}
  /* 血条 */
  .bar-row{position:absolute;left:50%;transform:translateX(-50%);}
  .bar-row.top{top:14px;} .bar-row.bottom{bottom:14px;}
  .bar{width:min(72cqw,380px);height:16px;background:rgba(90,80,50,.15);border:1px solid rgba(90,80,50,.3);
    border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(90,80,50,.15);}
  .bar>i{display:block;height:100%;width:100%;transition:width .35s cubic-bezier(.4,0,.2,1);}
  .bar.hero>i{background:linear-gradient(90deg,#3fae5a,#6cc47f);box-shadow:0 0 10px rgba(63,174,90,.5);}
  .bar.mon>i{background:linear-gradient(90deg,#f87171,#ff5c7a,#fb923c);box-shadow:0 0 10px rgba(248,113,113,.5);}
  .bar-label{font-size:13px;margin-bottom:5px;text-align:center;font-weight:600;text-shadow:0 1px 3px rgba(255,253,246,.9);}
  /* 战斗状态栏 */
  /* 连击倍率浮标（我方血条下方居中，击杀时弹跳） */
  .combo-chip{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-size:17px;font-weight:800;
    color:#d48806;letter-spacing:1px;pointer-events:none;white-space:nowrap;
    text-shadow:0 1px 3px rgba(255,253,246,.9),0 0 12px rgba(255,180,0,.5);}
  .combo-chip b{color:#c07800;}
  .combo-chip.pop{animation:comboPop .28s cubic-bezier(.34,1.56,.64,1);}
  @keyframes comboPop{0%{transform:translateX(-50%) scale(1)}45%{transform:translateX(-50%) scale(1.4)}100%{transform:translateX(-50%) scale(1)}}
  .float{position:absolute;transform:translate(-50%,-50%);font-weight:800;text-shadow:0 2px 6px rgba(255,253,246,.9),0 0 10px currentColor;
    pointer-events:none;z-index:5;font-size:24px;animation:floatUp 1.1s ease forwards;}
  .float.dmg{color:#d48806;} .float.heal{color:#2e9e57;} .float.hit{color:#e04444;}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}15%{opacity:1;transform:translate(-50%,-40%) scale(1.2)}30%{transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-200%) scale(.8)}}
  .run-name{position:absolute;top:8px;left:14px;font-size:13px;opacity:.85;text-shadow:0 1px 3px rgba(255,253,246,.8);}
  .score-chip{position:absolute;top:8px;right:14px;font-size:13px;color:var(--accent2);font-weight:600;
    text-shadow:0 0 8px rgba(63,174,90,.35);}
  .tip-bottom{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.9;text-align:center;
    text-shadow:0 1px 4px rgba(255,253,246,.8);animation:tipPulse 2s ease-in-out infinite;}
  @keyframes tipPulse{0%,100%{opacity:.6}50%{opacity:1}}
  .btn-row{display:flex;gap:12px;justify-content:center;margin-top:18px;}
  /* 面板内滚动时“继续”按钮吸底：小屏/横屏解析很长也始终可见可点 */
  /* “继续/下一步”按钮为普通文档流：排在解析文字之后，不悬浮不吸底 */
  /* 旧吸底按钮已删除：按钮随解析文字自然排在面板末尾 */
  .btn-main{background:linear-gradient(90deg,#3fae5a,#2e8b57);border:none;color:#fff;border-radius:12px;
    padding:13px 26px;font-size:15px;cursor:pointer;font-weight:600;
    box-shadow:0 0 20px rgba(63,174,90,.35);transition:.2s;}
  .btn-main:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 0 30px rgba(63,174,90,.55)}
  .btn-ghost{background:transparent;border:1px solid rgba(46,139,87,.5);color:#2e8b57;border-radius:12px;padding:13px 20px;cursor:pointer;font-size:14px;transition:.2s;}
  .btn-ghost:hover{background:rgba(63,174,90,.12);border-color:rgba(46,139,87,.8)}
  .big-num{font-size:56px;font-weight:800;color:var(--accent2);margin:8px 0;
    text-shadow:0 0 30px rgba(63,174,90,.4);animation:numPop .6s cubic-bezier(.34,1.56,.64,1);}
  @keyframes numPop{0%{transform:scale(0)}100%{transform:scale(1)}}
  /* 屏幕震动 */
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-4px,2px)}20%{transform:translate(4px,-2px)}30%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}50%{transform:translate(-2px,2px)}60%{transform:translate(2px,-2px)}70%{transform:translate(-1px,1px)}80%{transform:translate(1px,-1px)}90%{transform:translate(0,1px)}}
  /* 伤害红闪 */
  #damageFlash{position:fixed;inset:0;pointer-events:none;z-index:10;background:radial-gradient(circle,transparent 40%,rgba(248,113,113,.35) 100%);opacity:0;transition:opacity .2s;}
  #damageFlash.active{opacity:1}
  /* 胜利金色粒子 */
  .win-burst{position:fixed;inset:0;pointer-events:none;z-index:9;}
  .win-burst i{position:absolute;width:8px;height:8px;border-radius:50%;animation:winBurst 1.2s ease-out forwards;}
  /* 暗角：温暖纸张边缘感 */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 60%,rgba(120,100,60,.22) 100%);}
  @keyframes winBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}

  /* ============ v3：养成 / 章节 / 卡牌 / 成就 / 技能 ============ */
  /* 宽面板（滑动式：头部固定 + 内容区滚动，手机旋转态由 _ts 手动接管触摸滚动） */
  .panel.wide{width:min(94%,620px);height:88%;max-height:88%;display:flex;flex-direction:column;text-align:left;padding:20px 22px;}
  .panel.wide h1.title{text-align:center;flex:0 0 auto;}
  .panel.wide .sub{flex:0 0 auto;}
  .pg-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:4px;}
  /* 桌面：加粗加大的绿色轨道滚动条，方便拖拽；触屏：隐藏滚动条，纯手势滑动 */
  .pg-body::-webkit-scrollbar{width:14px}
  .pg-body::-webkit-scrollbar-thumb{background:rgba(63,174,90,.55);border-radius:9px;border:3px solid rgba(250,247,238,.9)}
  .pg-body::-webkit-scrollbar-thumb:hover{background:rgba(63,174,90,.85)}
  .pg-body::-webkit-scrollbar-track{background:rgba(63,174,90,.12);border-radius:9px}
  .pg-body{scrollbar-width:thin;scrollbar-color:rgba(63,174,90,.55) rgba(63,174,90,.12);}
  @media (pointer:coarse){ .pg-body::-webkit-scrollbar{display:none;width:0;height:0} .pg-body{scrollbar-width:none} }
  .wb-list{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  /* 档案栏（主菜单顶部） */
  .pf-bar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
    background:linear-gradient(90deg,rgba(63,174,90,.12),rgba(212,136,6,.1),rgba(63,174,90,.12));
    border:1px solid rgba(63,174,90,.3);border-radius:14px;padding:8px 16px;margin:10px 0 4px;font-size:14px;}
  .pf-bar .xp-wrap{display:flex;align-items:center;gap:6px;}
  .pf-bar .xpbar{width:110px;height:9px;background:rgba(90,80,50,.15);border-radius:6px;overflow:hidden;}
  .pf-bar .xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7cc97f,#3fae5a);transition:width .4s;}
  .pf-bar b.coins{color:#c07800;}
  /* 主菜单小功能按钮行 */
  .mini-row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
  .mini-btn{background:rgba(63,174,90,.1);border:1px solid rgba(63,174,90,.35);color:#2e5c40;
    border-radius:18px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.2s;}
  .mini-btn:hover{background:rgba(63,174,90,.25);transform:translateY(-2px);box-shadow:0 4px 14px rgba(63,174,90,.3);}
  /* 章节分组与小节网格 */
  .ch-group{margin:14px 0 4px;}
  .ch-head{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--accent2);
    padding:6px 4px;border-bottom:2px dashed rgba(63,174,90,.3);margin-bottom:10px;}
  .ch-head .ch-tag{background:linear-gradient(135deg,#3fae5a,#2e8b57);color:#fff;font-size:12px;
    border-radius:8px;padding:3px 10px;letter-spacing:1px;box-shadow:0 2px 8px rgba(46,139,87,.35);}
  .ch-head .ch-info{margin-left:auto;font-size:12px;font-weight:400;opacity:.7;}
  .sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .sec-btn{position:relative;background:rgba(63,174,90,.08);border:1px solid rgba(63,174,90,.3);
    border-radius:11px;padding:9px 8px;cursor:pointer;transition:.18s;text-align:center;overflow:hidden;}
  .sec-btn:hover{background:rgba(63,174,90,.2);transform:translateY(-2px);box-shadow:0 6px 16px rgba(63,174,90,.25);}
  .sec-btn .nm{font-size:13px;font-weight:600;line-height:1.35;display:block;}
  .sec-btn .meta{font-size:10px;opacity:.6;margin-top:3px;display:block;}
  .sec-btn .stars{font-size:12px;letter-spacing:1px;margin-top:2px;display:block;color:#d48806;text-shadow:0 0 6px rgba(255,180,0,.4);}
  .sec-btn .stars .off{opacity:.25;filter:grayscale(1);}
  .sec-btn.done{border-color:rgba(212,136,6,.5);background:rgba(212,136,6,.07);}

const _schoolFlatCache = {};
function schoolObj(){
  return gameType==='politics' ? (window.SCHOOLPOLITICS||{})
       : gameType==='physics' ? (window.SCHOOLPHYSICS||{})
       : (window.SCHOOLMATH||{});
}
function schoolFlat(){
  if(_schoolFlatCache[gameType]) return _schoolFlatCache[gameType];
  const sb = schoolObj(), out = {};
  for(const stage of Object.keys(sb)) for(const b of sb[stage]||[]) if(b && b.name) out[b.name] = b.secs || [];
  _schoolFlatCache[gameType] = out;
  return out;
}
function schoolStageOf(book){
  if(!book) return null;
  const sb = schoolObj();
  for(const stage of Object.keys(sb)) if((sb[stage]||[]).some(b=>b.name===book)) return stage;
  return null;
}
function schoolSecCount(obj){
  let n=0;
  for(const stage of Object.keys(obj||{})) for(const b of obj[stage]||[]) n += (b.secs||[]).length;
  return n;
}
function QBank(){
  const uni = gameType==='politics' ? POLITICS : gameType==='physics' ? PHYSICS : MATH;
  return Object.assign({}, uni, schoolFlat());
}

function addXP(n){
  const mult = 1 + cardBonus().xp;                 // 经验倍率：仅卡牌加成（等级不再加速，保证"全星≈满级"）
  const gain = Math.max(1, Math.round(n*mult));
  if(PF.lv >= MAX_LV) return gain;                 // 满级：经验不再累计
  PF.xp += gain;
  let ups=0;
  while(PF.xp >= xpNeed()){
    if(PF.lv >= MAX_LV){ PF.xp = 0; break; }       // 升到满级：清空溢出经验
    PF.xp -= xpNeed(); PF.lv++; ups++;
  }
  if(ups>0){
    levelFlash(); winBurst(); Sfx.win();
    toast(`🎉 勇者升级！Lv.${PF.lv}（攻击+4% · 生命+2）`, 'lv');
    checkAchs();

  return gain;

/* 手机竖屏旋转90度：画面高强制=屏幕短边(上下边框贴屏幕左右)，宽=min(长边, 高×16/9)居中；
   屏幕上下多出的部分用动态幻彩填充（#rotFill），不再强行拉伸铺满 */
const _mqCoarse = matchMedia('(pointer:coarse)');
const _rot = { on:false, w:0, h:0, top:0 };
function rot90(){ return _mqCoarse.matches && innerHeight > innerWidth; }
function viewSize(){ return { rot:_rot.on, w:_rot.on?_rot.w:innerWidth, h:_rot.on?_rot.h:innerHeight }; }
/* UI 等比缩放：#ui 层按画面高/600 缩放，得到与桌面完全相同再整体缩小的布局——
   按钮大小与位置随画面等比变化。用 zoom 实现，避免对滚动面板引入 transform 祖先：
   父级（#ui）带 transform 会在 iOS 上生成独立复合层，导致内层 overflow 容器
   无法触摸滚动（滚动条/程序化滚动仍正常）。zoom 在 Chrome/Safari/Firefox126+ 均支持；
   inset 采用显式像素+覆盖 right/bottom，规避旧版过约束问题 */
let UIZ = 1;
function applyUIScale(){
  const v = viewSize();
  UIZ = Math.max(0.55, Math.min(1, v.h/600));
  const u = document.getElementById('ui'), b = document.getElementById('bgmToggle');
  if(!u) return;
  if(UIZ >= 1){                                          // 桌面/大画面：还原默认布局
    u.style.cssText = '';
    if(b) b.style.transform = '';
    return;
  }
  u.style.left='0'; u.style.top='0'; u.style.right='auto'; u.style.bottom='auto';
  u.style.width = (v.w/UIZ)+'px'; u.style.height = (v.h/UIZ)+'px';
  u.style.zoom = UIZ;
  if(b){ b.style.transform = 'scale('+UIZ+')'; b.style.transformOrigin = '100% 100%'; }
}
function applyRot(){
  const a = document.getElementById('app'), fill = document.getElementById('rotFill');
  if(rot90()){
    const h = innerWidth;                                  // 画面高=屏幕短边
    const w = Math.min(innerHeight, Math.round(h*16/9));   // 画面宽≤长边，保持16:9
    const top = Math.max(0, Math.round((innerHeight-w)/2));// 旋转后画面竖直居中
    _rot.on=true; _rot.w=w; _rot.h=h; _rot.top=top;
    a.style.top=top+'px'; a.style.left=innerWidth+'px';
    a.style.width=w+'px'; a.style.height=h+'px';
    const gap = Math.max(0, innerHeight-w);
    fill.style.display = gap>2 ? 'block' : 'none';
    fill.style.setProperty('--gap', (gap/2)+'px');
  } else {
    _rot.on=false; a.style.cssText=''; fill.style.display='none';
  }
  applyUIScale();                                        // 画面框尺寸变化后重算 UI 等比缩放
}

/* 手机旋转态触摸滚动：transform:rotate(90deg) 容器内浏览器原生触摸滚动不可靠，
   手动接管——物理横向位移映射为面板逻辑竖向滚动(scrollTop+=物理x位移)，带惯性减速 */
const _ts = { el:null, id:-1, x0:0, lx:0, lt:0, top0:0, moved:false, vel:0, sup:0 };
let _tsGen = 0;
function _scrollAncestor(n){
  for(let e=n; e && e.nodeType===1 && e!==document.body; e=e.parentElement){
    const st=getComputedStyle(e);
    if((st.overflowY==='auto'||st.overflowY==='scroll') && e.scrollHeight>e.clientHeight+2) return e;
  }
  return null;
}
document.addEventListener('touchstart', e=>{
  _ts.sup=0; _tsGen++;
  if(!rot90()||_ts.el||e.touches.length!==1) return;
  const sc=_scrollAncestor(e.target);
  if(!sc) return;
  _ts.el=sc; _ts.id=e.touches[0].identifier;
  _ts.x0=_ts.lx=e.touches[0].clientX; _ts.top0=sc.scrollTop;
  _ts.moved=false; _ts.vel=0; _ts.lt=performance.now();
},{passive:true});
document.addEventListener('touchmove', e=>{
  if(!rot90()||!_ts.el) return;
  let t=null;
  for(const c of e.changedTouches) if(c.identifier===_ts.id) t=c;

const WEAPON_COLORS = [0xc0c0c0, 0xa8e6ff, 0x4dd0e1, 0xffd27a, 0xff7a7a, 0x4a90d9, 0xff5c7a];
const WEAPON_NAMES = ['铁剑','青铜剑','青寒刃','黄金圣剑','烈焰怒剑','碧海王剑','绯红魔剑'];
const TIER_ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// 武器名称无限循环：基础名按等级循环，每满一轮提升一个阶段后缀(无尽头)
function weaponName(lv){
  const base = WEAPON_NAMES[lv % WEAPON_NAMES.length];
  const tier = Math.floor(lv / WEAPON_NAMES.length);
  if(tier===0) return base;
  const suffix = tier <= TIER_ROMAN.length ? TIER_ROMAN[tier-1] : 'Lv'+tier;
  return base + ' ·' + suffix;
}
// 主色无限循环，并随阶段提升微调色相
function weaponColor(lv){
  const base = WEAPON_COLORS[lv % WEAPON_COLORS.length];
  const tier = Math.floor(lv / WEAPON_COLORS.length);
  if(tier===0) return base;
  const c = new THREE.Color(base);
  c.offsetHSL(tier*0.07 % 1, 0, Math.min(tier*0.03, 0.15)); // 逐阶段微提亮度/色相
  return c.getHex();
}
function weaponLevel(){
  const w = Math.max(1, P.weapon);
  if(w <= 32) return Math.round(Math.log2(w));      // 翻倍阶段：1→32 倍，等级 0→5
  return 5 + Math.ceil((w - 32) / 100);             // 32 倍后：每次强化 +100 攻击，逐级递增
}
// 随武器等级提升的攻速：等级越高，攻击间隔越短；倍率封顶MAX_ATK_MULT(120×)
// 32 倍攻击封顶后攻速继续提升，直到 120 倍后不再增长（之后每次强化仅 +100 攻击）
function heroAttackInterval(){
  return ATTACK_INTERVAL / heroAttackSpeedMult();
}
// 攻速倍率显示（相对基础攻速，封顶120×）
function heroAttackSpeedMult(){
  return Math.min(Math.pow(1/ATK_SPEED_FACTOR, weaponLevel()), MAX_ATK_MULT);
}

function camTween(toPos, toLook, dur, done){
  camAnim = { p0:camera.position.clone(), l0:menuCamLook.clone(),
              p1:toPos.clone(), l1:toLook.clone(), t0:performance.now(), dur:dur*1000, done };
}
function killMenuCam(){ camAnim=null; menuBusy=false; }
function updateMenuCam(now){
  if(camAnim){
    const k = Math.min(1,(now-camAnim.t0)/camAnim.dur);
    const e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;    // easeInOutQuad
    menuCamPos.lerpVectors(camAnim.p0, camAnim.p1, e);
    menuCamLook.lerpVectors(camAnim.l0, camAnim.l1, e);
    if(k>=1){ const d=camAnim.done; camAnim=null; if(d) d(); }
  }
  const s = camAnim ? 0.25 : 1;                          // 运镜时轻微手持感，空闲时缓慢呼吸
  camera.position.set(
    menuCamPos.x + Math.sin(now*0.00016)*0.6*s,
    menuCamPos.y + Math.sin(now*0.00023+1.3)*0.25*s,
    menuCamPos.z);
  camera.lookAt(menuCamLook.x, menuCamLook.y+(camAnim?0:Math.sin(now*0.00019)*0.15), menuCamLook.z);
}

/* ---------- 拨盘贴图 ---------- */
function roundRectPath(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function dialTexture(s){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=300;
  const g=cv.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,300);
  grad.addColorStop(0,'#fffdf6'); grad.addColorStop(1,'#f3ebd4');
  g.fillStyle=grad; roundRectPath(g,8,8,496,284,36); g.fill();
  const tint='#'+s.tint.toString(16).padStart(6,'0');
  g.lineWidth=8; g.strokeStyle=tint; roundRectPath(g,8,8,496,284,36); g.stroke();
  g.lineWidth=2; g.strokeStyle='rgba(63,174,90,.32)'; roundRectPath(g,24,24,464,252,28); g.stroke();
  g.textAlign='center'; g.textBaseline='middle';
  g.font='84px serif'; g.fillText(s.icon,256,110);
  g.fillStyle='#24523a'; g.font='bold 56px "Microsoft YaHei",sans-serif';
  g.fillText(s.title,256,192);
  g.fillStyle='#7d8a76'; g.font='30px "Microsoft YaHei",sans-serif';
  g.fillText(s.sub,256,246);
  const t=new THREE.CanvasTexture(cv); t.anisotropy=8; return t;
}
function softRadialTex(){
  const cv=document.createElement('canvas'); cv.width=cv.height=256;
  const g=cv.getContext('2d');
  const gr=g.createRadialGradient(128,128,10,128,128,128);
  gr.addColorStop(0,'rgba(255,255,255,.95)'); gr.addColorStop(.35,'rgba(255,255,255,.45)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(cv);
}
function cloudTex(){
  const cv=document.createElement('canvas'); cv.width=256; cv.height=128;
  const g=cv.getContext('2d');
  [[70,80,46],[128,66,56],[186,84,42],[100,94,32],[160,98,30]].forEach(([x,y,r])=>{
    const gr=g.createRadialGradient(x,y,r*.1,x,y,r);
    gr.addColorStop(0,'rgba(255,255,255,.85)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  });
  return new THREE.CanvasTexture(cv);
}

/* ---------- 拨盘几何与交互 ---------- */
function dialActiveIdx(){ return ((Math.round((Math.PI-dialAngle)/DIAL_STEP))%DIAL_N+DIAL_N)%DIAL_N; } // 身后(近处)卡位 a=π
function dialNearest(){ return Math.round(dialAngle/DIAL_STEP)*DIAL_STEP; }
function dialSlotFor(i){                                  // 把第 i 个按钮转到身后(近处)（取最近等效角）
  const want = Math.PI - i*DIAL_STEP;                       // 把第 i 个按钮转到身后(近处)
  return want + Math.round((dialAngle-want)/(Math.PI*2))*Math.PI*2;
}
const _ndc=new THREE.Vector2(), _ray=new THREE.Raycaster();
function dialPick(x,y){
  let px=x, py=y;
  if(rot90()){ px=y-_rot.top; py=innerWidth-x; }            // 手机旋转90度：屏幕坐标→逻辑渲染坐标(含画面居中偏移)
  const v=viewSize();
  _ndc.set(px/v.w*2-1, -(py/v.h*2-1));
  _ray.setFromCamera(_ndc,camera);
  const hits=_ray.intersectObjects(dialMeshes,false);
  return hits.length ? hits[0].object.userData.i : null;
}
function dialSelect(i){
  if(menuBusy||camAnim) return;
  menuBusy=true; Sfx.click();
  dialFlashT = performance.now()+700;                     // 选中按钮高亮弹跳
  selGate = {i, t0:performance.now()};                    // 选中按钮随压低视角升起淡出（让开门扉）
  camTween(DIP_POS, DIP_LOOK, 0.85, ()=>{                 // 先压低视角（从高到低，战士身后往前看）
    setTimeout(()=>{
      if(!document.getElementById('homeRadial')) return;  // 用户已切到其它面板则取消
      DIAL_SUBJECTS[i].enter();
      camTween(HIGH_POS, HIGH_LOOK, 1.5, ()=>{ menuBusy=false; });  // 选完缓慢抬升视角进入答题
    }, 430);
  });
}
canvas.addEventListener('pointerdown', e=>{
  if(state!=='menu'||menuBusy||camAnim||!dialGroup) return;
  dialDragging=true; dialPid=e.pointerId; dialMovedPx=0;
  dialStartX=e.clientX; dialStartY=e.clientY; dialStartAngle=dialAngle; dialVel=0;
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove', e=>{
  if(!dialDragging||e.pointerId!==dialPid) return;
  const dx = rot90() ? (e.clientY-dialStartY) : (e.clientX-dialStartX);  // 旋转态用逻辑横向
  dialMovedPx=Math.max(dialMovedPx,Math.abs(dx));
  dialAngle = dialStartAngle - dx*0.011;                  // 拖动实时跟手，不回弹
  dialTarget = dialAngle;
});
canvas.addEventListener('pointerup', e=>{
  if(!dialDragging||e.pointerId!==dialPid) return;
  dialDragging=false;
  if(dialMovedPx<8){                                      // 视为点按：射线拾取
    const hit=dialPick(e.clientX,e.clientY);
    if(hit!=null){
      if(hit===dialActiveIdx()) dialSelect(hit);           // 只有身后(近处)按钮可进入
      else dialTarget=dialSlotFor(hit);                   // 点其它按钮先转到身后
    }
  } else {
    dialTarget=dialNearest();                            // 松手吸附最近卡位
  }
});
canvas.addEventListener('pointercancel', ()=>{ dialDragging=false; dialTarget=dialNearest(); });
canvas.addEventListener('wheel', e=>{
  if(state!=='menu'||menuBusy||camAnim||!dialGroup) return;
  e.preventDefault();
  dialTarget = dialNearest() + (e.deltaY>0?-1:1)*DIAL_STEP;
},{passive:false});
addEventListener('keydown', e=>{
  if(state!=='menu'||menuBusy||camAnim||!dialGroup) return;
  if(e.key==='ArrowLeft')  dialTarget = dialNearest()+DIAL_STEP;
  if(e.key==='ArrowRight') dialTarget = dialNearest()-DIAL_STEP;
});

const _camDir=new THREE.Vector3();
function updateDial(dt, now, t){
  const show = state==='menu';
  dialGroup.visible = show; dialMark.visible = show;
  if(!show) return;
  if(!dialDragging){                                      // 弹簧吸附（带一点回弹手感）
    dialVel += (dialTarget-dialAngle)*dt*85;
    dialVel *= Math.exp(-10.5*dt);
    dialAngle += dialVel*dt;
    if(Math.abs(dialAngle)>Math.PI*8){                    // 防角度无限累计
      const s=Math.round(dialAngle/(Math.PI*2))*(Math.PI*2);
      dialAngle-=s; dialTarget-=s; dialStartAngle-=s;
    }
  }
  const act=dialActiveIdx();
  const flash = now<dialFlashT ? (dialFlashT-now)/700 : 0;
  const sel = selGate ? Math.min(1,Math.max(0,(now-selGate.t0)/650)) : 0;  // 选中按钮升起淡出进度
  dialBtns.forEach((grp,i)=>{
    const a = dialAngle + i*DIAL_STEP;                    // a=π 为身后(近处)卡位
    grp.position.set(Math.sin(a)*DIAL_R, 0, DIAL_CZ - Math.cos(a)*DIAL_R);
    grp.position.y = 1.52 + Math.sin(t*1.6+grp.userData.ph)*0.075 + (i===act?0.1:0) + (selGate&&selGate.i===i ? sel*2.4 : 0);
    grp.lookAt(camera.position.x, camera.position.y*0.6+grp.position.y*0.4, camera.position.z);
    grp.scale.setScalar(i===act ? 1.1+Math.sin(t*3.1)*0.028+flash*0.22 : 0.92);
    dialMeshes[i].material.opacity = (selGate&&selGate.i===i) ? 1-sel : 1;
  });
  const ab=dialBtns[act], ap=ab.position;                 // 身后(近处)当前按钮的辉光与地面标记
  _camDir.subVectors(camera.position, ap).normalize();
  dialGlow.position.copy(ap).addScaledVector(_camDir, 0.09);
  dialGlow.lookAt(camera.position);
  dialGlow.scale.setScalar(1.5 + flash*0.5);
  dialGlow.material.color.setHex(DIAL_SUBJECTS[act].tint);
  dialGlow.material.opacity = (0.42 + Math.sin(t*3.4)*0.16 + flash*0.5) * (1-sel);
  dialMark.position.set(ap.x, 0.04, ap.z);
  dialMark.material.color.setHex(DIAL_SUBJECTS[act].tint);
  dialMark.material.opacity = 0.5 + Math.sin(t*2.7)*0.22 + flash*0.4;
  dialMark.scale.setScalar(1 + flash*0.8);
}

function palLerp(stops,p,out){
  if(p<=stops[0][0]) return out.copy(stops[0][1]);
  for(let i=0;i<stops.length-1;i++){
    const t0=stops[i][0], t1=stops[i+1][0];
    if(p>=t0&&p<=t1) return out.copy(stops[i][1]).lerp(stops[i+1][1], (p-t0)/((t1-t0)||1));
  }
  return out.copy(stops[stops.length-1][1]);
}
function numLerp(stops,p){
  if(p<=stops[0][0]) return stops[0][1];
  for(let i=0;i<stops.length-1;i++){
    const t0=stops[i][0], t1=stops[i+1][0];
    if(p>=t0&&p<=t1) return stops[i][1]+(stops[i+1][1]-stops[i][1])*(p-t0)/((t1-t0)||1);
  }
  return stops[stops.length-1][1];
}

  hemi.intensity=numLerp(NUM.hemiI,p);
  dir.color.copy(palLerp(PAL.dirC,p,_tmpC1)); dir.intensity=numLerp(NUM.dirI,p);
  amb.intensity=numLerp(NUM.ambI,p);
  scene.fog.color.copy(palLerp(PAL.skyBot,p,_tmpC1)).lerp(palLerp(PAL.skyTop,p,_tmpC2),.35);
  starMat.opacity=numLerp(NUM.star,p);
  pMat.color.copy(palLerp(PAL.part,p,_tmpC1));
  const mc=palLerp(PAL.mount,p,_tmpC1);
  mounts.forEach(m=>m.material.color.copy(mc));
  if(p<0.46){                                             // 落日：缓缓沉入山后

    sunGrp.visible=true;

  });

// ---------- 数学公式渲染工具 ----------
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// 把字符串里 $...$ 或 \(...\) 的公式用 KaTeX 渲染为 HTML，其余文本转义；返回安全 HTML
function renderMath(s){
  s = (s===undefined||s===null)?'':String(s);
  const re=/\$(?!\$)\s*([\s\S]+?)\s*\$(?!\$)|\\\((.*?)\\\)/g;
  let out='', last=0, m;
  while((m=re.exec(s))!==null){
    out+=esc(s.slice(last,m.index));
    const tex=(m[1]!=null?m[1]:m[2]||'').trim();
    out+= window.katex ? katex.renderToString(tex,{throwOnError:false,displayMode:false}) : esc(tex);
    last=m.index+m[0].length;
  }
  out+=esc(s.slice(last));
  return out;
}

/* 数学/政治：章节/小节选择（按章分组，显示星级，可自由选择） */
function showChapterMenu(subject){
  level = subject;                 // 章节菜单期间记录当前科目
  state = 'chapter';
  const arr = QBank()[subject]||[];
  // 按章号分组（节名形如 "1.1 映射与函数"，"0.x" 为导论）
  const groups = new Map();
  arr.forEach((sec, idx)=>{
    const mm = /^(\d+)/.exec(sec.name);
    const chNo = mm ? parseInt(mm[1],10) : Math.floor(idx/10)+1;
    if(!groups.has(chNo)) groups.set(chNo, []);
    groups.get(chNo).push({sec, idx});
  });
  let html = `
    <div class="panel wide">
      <div class="sub" style="text-align:center;color:#8c8c7e;margin-bottom:4px">← <a href="#" id="backSub" style="color:#3fae5a">返回学科选择</a></div>
      <h1 class="title" style="font-size:22px">${modeIcon()} ${subject}</h1>
      <div class="sub" style="text-align:center">选择小节开始闯关 · 完成可获 ⭐金币 ✨经验 🎴卡牌</div>
      <div id="chGroups" class="pg-body"></div>
    </div>`;
  ui.innerHTML = html;
  ui.querySelector('#backSub').onclick=(e)=>{ e.preventDefault(); Sfx.click();
    if(schoolStage==='大学') showCollegeMenu();
    else if(schoolStage) showBookMenu(schoolStage);
    else showSubjectMenu();
  };
  const wrap = ui.querySelector('#chGroups');
  /* 解锁规则：每个科目的第 1 节始终解锁；其余按"前 2 节至少有星"解锁（复习自由 + 轻推主线） */
  const isUnlocked = (idx)=>{
    if(idx===0) return true;
    const prev1 = PF.stars[secKey(subject, idx-1)];
    const prev2 = idx>=2 ? PF.stars[secKey(subject, idx-2)] : true;
    return !!(prev1 || prev2);
  };
  // 构建"章头 + 小节按钮"的块序列（分页打散，头部按需停留在页首）
  const blocks = [];
  const revealedSet = window.__bt_cloudRevealed || (window.__bt_cloudRevealed = new Set());
  for(const [chNo, items] of groups){
    const doneN = items.filter(it=>PF.stars[secKey(subject,it.idx)]).length;
    const starN = items.reduce((n,it)=>n+(PF.stars[secKey(subject,it.idx)]||0),0);
    const chTopic = items[0].sec.name.replace(/^[\d.]+\s*/,'');
    blocks.push({h:`<div class="ch-head"><span class="ch-tag">${chNo===0?'导论':'第 '+chNo+' 章'}</span>
      <span>${chTopic}</span>
      <span class="ch-info">★${starN}/${items.length*3} · 已通 ${doneN}/${items.length}</span></div>`});
    items.forEach(({sec, idx})=>{
      const stars = PF.stars[secKey(subject, idx)]||0;
      const unlocked = isUnlocked(idx);
      const qn = sec.qs ? sec.qs.length : 0;
      blocks.push({x:`<button class="sec-btn ${stars?'done':''} ${unlocked?'':'locked'}">
        <span class="nm">${sec.name}</span>
        <span class="meta">${qn} 题${unlocked?'':' 🔒'}</span>
        <span class="stars">${starHTML(stars)}</span></button>`, idx, unlocked});
    });
  }
  const body = wrap;
  const renderBlocks = (blocksAll)=>{                       // 全量渲染进滚动区：上下滑动浏览（手机旋转态由 _ts 接管触摸滚动）
    body.innerHTML=''; let grid = null;
    blocksAll.forEach(blk=>{
      if(blk.h!==undefined){ const g=el('<div class="ch-group"></div>'); g.innerHTML=blk.h; body.appendChild(g); grid=null; }
      else{
        if(!grid){ grid=el('<div class="ch-group"><div class="sec-grid"></div></div>'); body.appendChild(grid); }
        const sg = grid.querySelector('.sec-grid');
        const b = el(blk.x);
        b.onclick=()=>{
          if(!blk.unlocked){ Sfx.wrong(); toast('🔒 先通关前面的小节解锁（相隔一节即可）'); return; }
          Sfx.click(); startSection(blk.idx);
        };
        /* 章节云朵遮罩 + 解锁探索式飘云：锁定被云遮住；解锁的小节首次滚动到可见时云朵飘散露出内容 */
        (function(b2, idx2, un2){
          const cloudKey = subject + '|' + idx2;
          if(!un2){ b2.appendChild(el('<span class="sec-cloud"></span>')); return; }
          if(revealedSet.has(cloudKey)) return;            // 已探索过 → 不再罩云
          const cloud = el('<span class="sec-cloud"></span>');
          b2.appendChild(cloud);
          const drift = ()=>{ revealedSet.add(cloudKey); cloud.classList.add('drift'); cloud.addEventListener('animationend', ()=>cloud.remove(), {once:true}); };
          if(typeof IntersectionObserver==='undefined'){ drift(); return; }
          const io = new IntersectionObserver((ents, obs)=>{
            ents.forEach(en=>{ if(en.isIntersecting && !b2.classList.contains('locked')){ drift(); obs.disconnect(); } });
          }, {threshold:.55});
          io.observe(b2);
        })(b, blk.idx, blk.unlocked);
        sg.appendChild(b);
      }
    });
  };
  renderBlocks(blocks);
}

// 2) 清洗释义：去掉学科标签/词性/动词变形括号，只留有效中文
function cleanZh(zh){
  if(typeof zh!=='string') return '';
  let s = zh;
  s = s.replace(/\[([^\]]*)\]/g, '');                 // 去掉[...]（学科标签或动词变形）
  s = s.replace(/\s*(n&v|n&vt|n&vi|vt&n|vi&n|adj&adv|adv&adj|modal\s+verb|indefinite\s+art|aux\s+v|v&n|det,pron|adv,prep|prep,adv|adv,adj|a&ad|n|vt|vi|adj|ad|adv|conj|prep|pron|det|v)\b[;，、]*/gi, '');
  s = s.replace(/[\s，、;]+$/g, '');                  // 去尾部残留
  return s.trim();
}
// 3) 修复单条：先清洗；清洗后无有效中文则查修复词典；仍无效返回null
function fixEntry(en, zh){
  zh = cleanZh(zh);
  if(!/[\u4e00-\u9fff]/.test(zh)){                 // 清洗后无中文（词性标记/变形残留）→ 用词典
    zh = FIX_DICT[en] || '';
  }
  if(!/[\u4e00-\u9fff]/.test(zh)) return null;       // 连词典也没有 → 彻底无效
  const enOk = /^[a-zA-Z][a-zA-Z' .\u00C0-\u024F&-]*$/.test(en);   // 放行 Mr. vs. resumé
  if(!enOk) return null;
  return [en, zh];
}
// 4) 有效词池（清洗+修复后的展示用基础数据，懒构建后缓存）
const _poolCache = {};
function validPool(){
  const lv = level;
  if(_poolCache[lv]) return _poolCache[lv];
  const out = [];
  for(const [en,zh] of DATA[lv]){
    const f = fixEntry(en,zh);
    if(f) out.push(f);
  }
  _poolCache[lv] = out;
  return out;
}
function pickWord(){
  const valid=validPool(); let w=null;
  // 优先从当前等级有效词里抽取
  for(let i=0;i<valid.length;i++){ const c=valid[(Math.random()*valid.length)|0]; if(!usedWords.has(c[0])){ w=c; break; } }
  if(!w){
    // 打完了，清空重来但绝不用坏词
    usedWords.clear();
    const c=valid[(Math.random()*valid.length)|0]; if(c) w=c;
  }
  usedWords.add(w[0]); curWord=w;
}
/* ============ 累计错误机制：每错一题打一个红叉 ============ */
/* 英语：错满 5 次立即判负；数学：错满 5 次怪物狂暴、战斗注定失败 */
const WRONG_LIMIT = 5;
function xRowHTML(){
  let boxes='';
  for(let i=0;i<WRONG_LIMIT;i++) boxes += `<span class="xbox ${i<P.wrong?'hit':''}"></span>`;
  const left = WRONG_LIMIT - P.wrong;
  const label = gameType!=='english' ? `✖ 错题 ${P.wrong}/${WRONG_LIMIT}` : `✖ 容错 ${left}/${WRONG_LIMIT}`;
  return `<span class="xl">${label}</span>${boxes}`;
}
function xRowWrap(){ return `<div class="xrow ${WRONG_LIMIT-P.wrong<=1?'danger':''}" id="xrow">${xRowHTML()}</div>`; }
function updateXRow(){
  const x=ui.querySelector('#xrow'); if(!x) return;
  x.innerHTML=xRowHTML();

}
function showQuestion(){
  if(gameType!=='english') return showQuestionMath();
  return showQuestionEn();
}
function showQuestionEn(){
  pickWord();
  const [en,zh]=curWord;
  const showEn = Math.random()<0.5; // true:给英文选中文; false:给中文选英文
  curEnQ=[en,zh,showEn];
  const question = showEn?`指译：“${en}”`:`译回：“${zh}”`;
  const correct = showEn?zh:en;
  // 混淆项：从同等级有效词里随机抽含义（避免出现 "n&v" 等脏数据）
  const opts=[correct]; const pool=validPool();
  while(opts.length<4 && opts.length<pool.length){
    const c=pool[(Math.random()*pool.length)|0];
    const cand = showEn?c[1]:c[0];
    if(!opts.includes(cand)) opts.push(cand);
  }
  // 打乱
  for(let i=opts.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[opts[i],opts[j]]=[opts[j],opts[i]];}
  ui.innerHTML=`
    <div class="panel">
      <div class="sub">${level} · 第 ${P.round+1} 关词汇挑战</div>
      ${xRowWrap()}
      <div class="${showEn?'q-en':'q-zh'}">${showEn?en:zh}</div>
      <div class="sub" style="margin-bottom:8px">请选出它的${showEn?'中文意思':'英文拼写'}</div>
      <div id="opts"></div>
      <div class="hint" id="qhint"></div>
    </div>`;
  const box=ui.querySelector('#opts');
  opts.forEach(o=>{
    if(o===undefined||o===null) return;
    const b=el(`<button class="opt-btn">${o}</button>`);
    b.onclick=()=>answerEn(o,correct,b);
    box.appendChild(b);
  });
}

function showQuestionMath(){

  ui.innerHTML=`

    </div>`;
  const box=ui.querySelector('#opts');
  q.opts.forEach((o,i)=>{

function answerMath(choice, correctIdx, btn){
  if(answered) return; answered=true;
  const ok = choice===correctIdx;
  const sec = QBank()[level][P.round];
  const q = sec && sec.qs ? sec.qs[P.step] : null;
  const qhint=ui.querySelector('#qhint'); const btns=ui.querySelectorAll('.opt-btn');
  btns.forEach((b,i)=>{ b.style.pointerEvents='none'; if(i===correctIdx) b.classList.add('correct'); });
  if(!ok) btn.classList.add('wrong');
  const whyWrap=ui.querySelector('#whyWrap');
  let whyHTML='';
  if(ok){
    P.correct++; PF.stats.correct++;
    const xp=addXP(5); saveProfile();
    Sfx.correct();
    if(q && q.why){
      whyHTML=`<div class="why-box"><span class="wb-tag">💡 解析 · 为什么</span><div>${renderMath(q.why)}</div></div>`;
    }
    qhint.innerHTML=`✔ 答对啦！✨+${xp} 经验${q&&q.why?' · 看看解析再走':''}`;
  }else{
    P.wrong++; PF.stats.wrong++;
    const xp=addXP(1); saveProfile();
    Sfx.wrong();
    updateXRow();
    const rightTxt = (q && q.opts && q.opts[correctIdx]) ? q.opts[correctIdx] : '';
    const chosenTxt = (q && q.opts && q.opts[choice]) ? q.opts[choice] : '';
    addWrongBook(q, chosenTxt, rightTxt);
    const why = (q && q.why) ? renderMath(q.why) : '';
    whyHTML=`<div class="why-box" style="border-left-color:#ef4444"><span class="wb-tag" style="background:#ef4444">💡 正确答案与解析</span>
      <div style="margin-bottom:6px">正确答案：${renderMath(rightTxt)}</div>
      ${why?`<div>${why}</div>`:'<div style="opacity:.7">本题暂无解析，可在教材对应小节回顾。</div>'}</div>`;
    qhint.innerHTML = P.wrong>=WRONG_LIMIT
      ? `💀 已错满 ${WRONG_LIMIT} 题！怪物狂暴已不可阻挡，本节注定失守……`
      : `✘ 答错了（✨+${xp} 安慰经验）· 读懂解析，点击继续`;
  }
  if(whyHTML) whyWrap.innerHTML=whyHTML;
  // 继续按钮：读完解析自己掌握节奏（回车/空格也能继续）
  const bar=el(`<div class="btn-row"><button class="btn-main" id="btnNext">${ok?'下一步 ▸':'继续 ▸'}</button></div>`);
  whyWrap.appendChild(bar);
  let gone=false;
  const go=()=>{
    if(gone) return; gone=true;
    window.removeEventListener('keydown', onKey);
    if(ok){ state='upgrade'; showUpgrade(); }
    else { mathAdvance(); }
  };
  const onKey=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); Sfx.click(); go(); } };
  window.addEventListener('keydown', onKey);
  ui.querySelector('#btnNext').onclick=()=>{ Sfx.click(); go(); };
  // 无解析且答对：保持原有的短自动跳转节奏
  if(ok && !(q&&q.why)) setTimeout(go, 850);
}

/* ============ 小怪模型（Q版小恶魔：圆身大头+蝙蝠翅+扇翅动画） ============ */
function buildMinion(color){
  const g = new THREE.Group();
  // 每只小怪带轻微色相/亮度抖动，避免千人一面
  const c = new THREE.Color(color);
  c.offsetHSL((Math.random()-.5)*.05, 0, (Math.random()-.5)*.07);
  const skin = new THREE.MeshStandardMaterial({color:c, roughness:.45, emissive:c, emissiveIntensity:.28});
  const darkM = new THREE.MeshStandardMaterial({color:0x241631, roughness:.6});
  const hornM = new THREE.MeshStandardMaterial({color:0xf0d9a8,roughness:.35});
  // 圆滚滚身体 + 大头（头大身小更萌）
  const body = new THREE.Mesh(new THREE.SphereGeometry(.5,16,12), skin);
  body.scale.set(1,.92,.95); body.position.y=.62; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.4,16,12), skin); head.position.y=1.3; g.add(head);
  // 小尖耳（圆头收尖，整体随耳旋转）
  [-1,1].forEach(s=>{
    const earG = new THREE.Group();
    const ear = new THREE.Mesh(new THREE.ConeGeometry(.07,.18,6), skin);
    ear.position.y=.09; earG.add(ear);
    const earTip = new THREE.Mesh(new THREE.SphereGeometry(.035,8,6), skin);
    earTip.position.y=.18; earG.add(earTip);
    earG.position.set(s*.37,1.44,-.02); earG.rotation.z=s*1.1; g.add(earG);
  });
  // 大眼睛（白眼底 + 红瞳 + 高光，三层更传神）
  const whiteM = new THREE.MeshStandardMaterial({color:0xffffff,roughness:.25});
  [-.15,.15].forEach(x=>{
    const w = new THREE.Mesh(new THREE.SphereGeometry(.115,12,10), whiteM);
    w.scale.set(1,1.1,.55); w.position.set(x,1.38,.3); g.add(w);
    const p = new THREE.Mesh(new THREE.SphereGeometry(.055,10,8), new THREE.MeshBasicMaterial({color:0xff3030}));
    p.position.set(x,1.38,.38); g.add(p);
    const hl = new THREE.Mesh(new THREE.SphereGeometry(.02,8,6), new THREE.MeshBasicMaterial({color:0xffffff}));
    hl.position.set(x+.025,1.43,.42); g.add(hl);
  });
  // 微笑（弧形）+ 双小獠牙
  const smile = new THREE.Mesh(new THREE.TorusGeometry(.1,.024,6,12,Math.PI),
    new THREE.MeshBasicMaterial({color:0x2a0a12}));
  smile.rotation.z=Math.PI; smile.position.set(0,1.19,.36); g.add(smile);
  const fangM = new THREE.MeshStandardMaterial({color:0xfff8ec,roughness:.3});
  const f1 = new THREE.Mesh(new THREE.ConeGeometry(.032,.12,6), fangM);
  f1.position.set(-.078,1.13,.38); g.add(f1);
  const f2 = f1.clone(); f2.position.x=.078; g.add(f2);
  // 两段奶金小弯角（圆头收尖）
  [-1,1].forEach(s=>{
    const h1 = new THREE.Mesh(new THREE.ConeGeometry(.075,.26,8), hornM);
    h1.position.set(s*.2,1.66,0); h1.rotation.z=s*.45; g.add(h1);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(.045,8,6), hornM);
    tip.position.set(s*.29,1.8,0); g.add(tip);
  });
  // 小蝙蝠翅膀（贝塞尔剪影 + 主骨，待机扇动）
  const wingM = new THREE.MeshStandardMaterial({color:0x3a2a5e,roughness:.55,side:THREE.DoubleSide,transparent:true,opacity:.96});
  const wings = [];
  [-1,1].forEach(s=>{
    const w = new THREE.Group();
    const membrane = new THREE.Mesh(WING_GEO, wingM);
    if(s<0) membrane.scale.x=-1;
    w.add(membrane);
    const bone = new THREE.Mesh(new THREE.CapsuleGeometry(.02,.5,3,6), darkM);
    bone.rotation.z=s*1.32; bone.position.set(s*.26,.12,0); w.add(bone);
    w.position.set(s*.36,.9,-.18); w.userData.side=s; g.add(w); wings.push(w);
  });
  // 弯曲小尾巴（圆润球串，翘在背后）
  const tail = new THREE.Group();
  const ta1 = new THREE.Mesh(new THREE.SphereGeometry(.075,12,10), skin);
  ta1.position.set(0,.14,-.16); tail.add(ta1);
  const ta2 = new THREE.Mesh(new THREE.SphereGeometry(.06,12,10), skin);
  ta2.position.set(0,.27,-.29); tail.add(ta2);
  const taTip = new THREE.Mesh(new THREE.SphereGeometry(.045,10,8), darkM);
  taTip.position.set(0,.38,-.38); tail.add(taTip);
  tail.position.set(0,.52,-.4); g.add(tail);
  // 小短臂 + 手套感圆手 + 三尖小爪
  [-1,1].forEach(s=>{
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(.085,.24,4,8), skin);
    arm.position.set(s*.48,.7,0); arm.rotation.z=s*.6; g.add(arm);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(.11,10,8), skin);
    hand.position.set(s*.62,.42,.05); g.add(hand);
    for(let i=-1;i<=1;i++){
      const cl = new THREE.Mesh(new THREE.ConeGeometry(.026,.12,6), darkM);
      cl.position.set(s*.62+i*.055,.33,.09); cl.rotation.x=Math.PI; g.add(cl);
      const ct = new THREE.Mesh(new THREE.SphereGeometry(.015,6,4), darkM);
      ct.position.set(s*.62+i*.055,.33-.06,.09); g.add(ct);
    }
  });
  // 圆短腿（压扁球）
  [-1,1].forEach(s=>{
    const ft = new THREE.Mesh(new THREE.SphereGeometry(.15,10,8), darkM);
    ft.scale.set(1,.62,1.25); ft.position.set(s*.2,.09,.08); g.add(ft);
  });
  g.userData = {wings, ph:Math.random()*6.28, flashR:1.05, flashY:.85, baseScale:.92+Math.random()*.22};
  g.scale.setScalar(g.userData.baseScale);
  return g;
}

function spawnBoss(hp, atk, r, berserk){
  const b = buildMonster(levelColor(), r);
  b.position.set(0, 0, BOSS_SPAWN_Z);
  if(berserk){
    // 狂暴形态：体型膨胀+通体泛红+移速大增，无视小怪队列直接冲脸
    b.userData.baseScale *= 1.45;
    b.scale.setScalar(b.userData.baseScale);
    const mats = new Set();
    b.traverse(o=>{
      if(!o.material) return;
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.emissive) mats.add(m); });
    });
    const red = new THREE.Color(0xff1a1a);
    mats.forEach(m=>{
      m.emissive.lerp(red, .65);
      m.emissiveIntensity = Math.max(m.emissiveIntensity||.3, .8);
    });
  }
  scene.add(b);
  enemies.push({group:b, hp, maxHp:hp, atk, speed: berserk ? 3.2 : BOSS_SPEED, type:'boss',
                alive:true, nextMelee:0, inContact:false, spawnAt:performance.now(), homeX:0, hits:0, berserk:!!berserk});
  if(berserk){
    setTimeout(()=>{
      floatText(b.position.clone().add(new THREE.Vector3(0,4.4,0)), '👹 狂 暴 ！！', '#ff3030');
      spawnRing(b.position.clone(), 5.5, 0xff2020);
      screenShake(0.5);
      Sfx.explode();
    }, 500);
  }
}
/* 战斗采用纯自动攻防：无主动技能，专注答题强化武器 */
function enterBattle(){
  answered=false; curWord=null; state='battle';
  // 每关随机切换场景主题（与上一关不同）
  applyTheme();
  // 清理上一局
  clearEnemies();
  spawnQueue=[]; bossDuelNoted=false; chipAcc=0; killCombo=0;
  const r = P.round;
  const heroDPS = heroAtk() / heroAttackInterval();     // 当前每秒输出（养成加成后）
  // 攻速封顶后小怪数值冻结：血量/数量按封顶等级的等效攻击力计算，不再随等级增长
  const effWeapon = Math.min(heroAtk(), Math.pow(2, ATK_CAP_LV));
  const effDPS = effWeapon / heroAttackInterval();
  // 小怪阶段时长预算：第一关无预算（固定保底配置），之后=首关实测用时
  const budget = (r===0) ? 0 : Math.min(15, Math.max(5, P.stage1Time || DEFAULT_STAGE1_TIME));
  curStageBudget = budget;
  curBerserk = false;
  let minionCount, minionHP, bossHP, bossATK;
  if(gameType!=='english'){
    /* 数学/政治/物理战斗：按「本轮题目数 × 40%」动态锚定怪物数值——
       答对约 40% 的题并选择武器强化，攻击力即可达到锚定值，
       怪物总生命 = 所需攻击次数 × 锚定攻击力，答对 4 成题就能清场；
       BOSS 攻击温和（约6%/击），答对越多武器越强、清场越快，不再被怪物打死。
       错满 5 题怪物狂暴：怪血翻 3 倍 + BOSS 攻击致命，注定失败。 */
    const sec = (QBank()[level] && QBank()[level][r]) || {qs:[]};
    const N = Math.max(1, Math.min(40, sec.qs.length));     // 本轮题目数（上限40）
    curBerserk = P.wrong >= WRONG_LIMIT;
    const needHits = Math.max(2, Math.round(N * 0.4));      // 答对40%题目 = 击杀所需攻击次数
    const k40 = Math.min(5, needHits);                      // 40%答对对应的武器强化次数
    const wep40 = Math.pow(2, k40);                         // 对应武器攻击倍数
    const atk40 = Math.max(1, Math.round(wep40 * heroBonus().atk));  // 锚定攻击力
    const totalHP = Math.max(20, needHits * atk40);         // 怪物总生命
    minionCount = Math.min(40, Math.max(12, Math.round(N * 4)));     // 小怪数量随题数放大，最多40只
    curStageBudget = 6;                                  // 出怪节奏：6秒小怪阶段
    if(curBerserk){
      minionHP = Math.max(1, Math.ceil(totalHP * 1.5 / minionCount)); // 狂暴：怪血翻3倍，只进不出
      bossHP   = Math.ceil(totalHP * 1.5);                // 狂暴BOSS不可击杀
      bossATK  = Math.max(6, Math.ceil(P.maxHp * 0.3));   // 狂暴BOSS三四口咬死战士
    }else{
      minionHP = Math.max(1, Math.ceil(totalHP * 0.5 / minionCount)); // 小怪阶段消耗一半怪血
      bossHP   = Math.max(6, Math.ceil(totalHP * 0.5));               // BOSS吃掉另一半
      bossATK  = Math.max(2, Math.ceil(P.maxHp * 0.06));              // BOSS磨血：约6%/击
    }
  }else if(r===0){
    // 第一关保底：3只脆皮小怪+低血BOSS，确保必定能过，并记录本关用时作为后续基准
    minionHP = STAGE1_MINION_HP;
    minionCount = STAGE1_MINIONS;
  }else{
    // 小怪总血量 = 首关用时 × 当前DPS → 清怪耗时与首关持平
    // 数量随攻击力/攻速动态增长（打得越快，怪越多越爽，但用时不变）
    // 攻速封顶后：血量/数量冻结在封顶水准（真实攻击力继续增长→清怪越来越快）
    minionHP = Math.ceil(2 + effWeapon);
    minionCount = Math.max(3, Math.min(40, Math.round(budget * effDPS / minionHP)));
  }
  // BOSS血量按DPS缩放 → BOSS战时长基本恒定(约3~4.6s)；同时封顶50刀伤害
  // 配合"受击50次秒杀"规则，保证后期BOSS战不超过50刀（血量数字不会膨胀成天文数字）
  if(gameType==='english'){   // 英语：BOSS血量按DPS缩放、50刀封顶；数学/政治已在上面按通关门槛锚定
    bossHP = r===0 ? STAGE1_BOSS_HP
      : Math.min(Math.max(6, Math.round(Math.max(3.2, 4.6 - r*0.12) * heroDPS)), BOSS_KILL_HITS * heroAtk());
    bossATK = Math.min(5, 1 + Math.floor(r/4));   // BOSS攻击缓慢增长，封顶5
  }
  // 动态难度：按近期胜败压力缩放小怪/BOSS 数值（英语首关保底除外）
  curDiffMult = diffMult();
  if(curDiffMult > 1.001 && !(gameType==='english' && r===0)){
    minionHP = Math.max(1, Math.ceil(minionHP*curDiffMult));
    bossHP   = Math.ceil(bossHP*curDiffMult);
    bossATK  = Math.max(1, Math.ceil(bossATK*(1+(curDiffMult-1)*0.6)));
  }
  // 小怪波次计划：每波2~4只（前后错位成多行），压缩在预算前35%出完
  // → 出怪速度快于击杀速度，小怪会在战士前排成贴身围攻队列（有压迫感但伤害可控）
  const waveSize = minionCount<=6 ? 2 : minionCount<=14 ? 3 : 4;
  const waves = Math.ceil(minionCount / waveSize);
  const period = Math.max(0.55, (curStageBudget || 6) * SPAWN_SPAN / waves);
  const lanes = [-1.35, 1.35, 0, -0.7, 0.7];
  let idx=0, li=0;
  for(let w=0; w<waves; w++){
    const size = Math.min(waveSize, minionCount - idx);
    for(let j=0; j<size; j++, idx++){
      spawnQueue.push({t: 400 + w*period*1000 + j*380, hp:minionHP, atk:1,
                       lane: lanes[(li++)%lanes.length], row:j});
    }
  }
  spawnQueue.sort((a,b)=>a.t-b.t);
  // BOSS压轴登场：从远处缓慢逼近，小怪清完后进入决战
  spawnBoss(bossHP, bossATK, r, curBerserk);

  doorGroup.visible=false;
  heroGroup.position.set(0,0.7,HERO_Z);
  setView();
  showBattle(minionCount);
  battleBusy=true;
  battleStart = performance.now();
  heroNextAttack = performance.now() + 600;
  lastBattleTick = 0;
}

  const boss = enemies.find(e=>e.type==='boss');
  const name = weaponName(weaponLevel());
  const sec = gameType!=='english' ? QBank()[level][P.round] : null;
  const placeTxt = sec ? `${modeIcon()} ${sec.name}` : `第 ${P.round+1} 关`;
  ui.innerHTML=`
    <div class="bar-row top"><div class="bar-label">🛡 我方生命</div>
      <div class="bar hero"><i id="bhb"></i></div></div>
    <div class="bar-row bottom" style="bottom:150px"><div class="bar-label">👾 BOSS HP · 攻击 ${boss?boss.atk:0}</div>
      <div class="bar mon"><i id="mhb"></i></div></div>
    <div class="score-chip">${placeTxt} · ${name} Lv${weaponLevel()} · ⚔攻击 <b id="pAtk">${heroAtk()}</b> · 攻速${heroAttackSpeedMult().toFixed(1)}× · 得分 <b id="scoreVal">${P.score}</b>${curDiffMult>1.01?` · <b style="color:#ff5c5c">👹怪物×${curDiffMult.toFixed(1)}</b>`:''}</div>
    <div id="comboChip" class="combo-chip" style="display:none"></div>
    <div class="tip-bottom" id="btip" style="bottom:210px${curBerserk?';color:#ff5c5c;font-weight:800':''}">${curBerserk?`👹 怪物狂暴！错满 ${WRONG_LIMIT} 题 —— 本节注定失守……`:`⚔ 小怪来袭 ×${minionCount}，全部消灭！`}</div>`;
  updateBars();
}
// 连击倍率：本局连续击杀，每3连+1×，封顶×10
function comboMult(){ return Math.min(10, 1 + Math.floor(killCombo/3)); }
function updateComboUI(){
  if(killCombo > PF.stats.maxCombo){ PF.stats.maxCombo = killCombo; saveProfile(); checkAchs(); }
  const chip=ui.querySelector('#comboChip'); if(!chip) return;
  if(killCombo<=0){ chip.style.display='none'; return; }
  chip.style.display='block';
  chip.innerHTML=`连击 ${killCombo} <b>×${comboMult()}</b>`;
  chip.classList.remove('pop'); void chip.offsetWidth; chip.classList.add('pop');
}
function updateScoreUI(){
  const sv=ui.querySelector('#scoreVal'); if(sv) sv.textContent=P.score;
}
function updateBars(){
  const bh=ui.querySelector('#bhb'); if(bh) bh.style.width=(Math.max(0,P.hp)/P.maxHp*100)+'%';
  const boss=enemies.find(e=>e.type==='boss');
  const mh=ui.querySelector('#mhb'); if(mh&&boss) mh.style.width=(Math.max(0,boss.hp)/boss.maxHp*100)+'%';
}
function findNearestEnemy(){
  let best=null, bestD=Infinity;
  for(const e of enemies){
    if(!e.alive) continue;
    const d = HERO_Z - e.group.position.z; // 越接近战士距离越小
    if(d < bestD){ bestD=d; best=e; }
  }
  return best;
}
// 怪物动画时间窗：受伤后缩(0..1) / 进攻前扑(0..1)，大小怪通用
function hurtW(now,e){ const d=now-(e.hurtAt||-1e9); return (d<0||d>260) ? 0 : Math.sin(Math.min(1,d/260)*Math.PI); }
function atkW(now,e){ const d=now-(e.atkAt||-1e9); return (d<0||d>340) ? 0 : Math.sin(Math.min(1,d/340)*Math.PI); }
function damageEnemy(e, dmg, crit){
  e.hp -= dmg;
  // BOSS被攻击满50次立即秒杀（后期攻击力爆炸时限制BOSS战时长，节省运行开销）
  // 数学/政治模式除外：BOSS血量锚定通关门槛，必须靠门槛战力正面斩杀（差一步强化就杀不动、狂暴BOSS更不可击杀）
  if(e.type==='boss' && gameType==='english' && ++e.hits >= BOSS_KILL_HITS) e.hp = 0;
  (e.type==='boss'?Sfx.bossHit():Sfx.hit());
  const pos = e.group.position.clone().add(new THREE.Vector3(0, e.type==='boss'?3.4:1.9, 0));
  if(crit){
    floatText(pos.clone().add(new THREE.Vector3(0,0.6,0)), '💥暴击 '+dmg, '#ff5c7a');
    spawnRing(e.group.position.clone(), e.type==='boss'?3.4:1.9, 0xff5c7a);
  }else{
    floatText(pos, '-'+dmg, '#d48806');
  }
  // 视觉反馈
  flashMesh(e.group);
  e.hurtAt = performance.now();               // 触发受伤后缩动画（含大小怪）
  if(e.hp<=0){
    e.alive=false;
    e.group.visible=false;
    burstAt(e.group.position.clone(), e.type==='boss'?45:25, e.type==='boss');
    spawnRing(e.group.position.clone(), e.type==='boss'?3.4:1.9, e.type==='boss'?0xffd700:levelColor());
    Sfx.explode();
    if(e.type==='boss'){
      winBurst(); screenShake(0.25); Sfx.win();
      // BOSS击杀：按当前连击倍率大额加分 + 金币/能量/档案
      const pts=50*comboMult();
      P.score+=pts; updateScoreUI();
      floatText(e.group.position.clone().add(new THREE.Vector3(0,3.4,0)), '+'+pts, '#c07800');
      addCoins(10+comboMult()*2); saveProfile();
      PF.stats.bossKills++; PF.stats.kills++; saveProfile(); checkAchs();
    }else{
      screenShake(0.08);
      // 连击加分：连续击杀提升分数倍率（每3连+1×，封顶×10），倍率提升时触发金色特效
      const before=comboMult();
      killCombo++;
      const m=comboMult();
      const pts=10*m;
      P.score+=pts;
      floatText(e.group.position.clone().add(new THREE.Vector3(0,2.7,0)), '+'+pts+(m>1?' ×'+m:''), '#c07800');
      updateComboUI(); updateScoreUI();
      PF.stats.kills++;
      if(Math.random()<0.35) addCoins(1+(Math.random()<0.2?1:0));
      saveProfile();
      if(m>before){
        spawnRing(heroGroup.position.clone(), 2.4, 0xffd700);
        floatText(heroGroup.position.clone().add(new THREE.Vector3(0,3.4,0)), '分数倍率 ×'+m+'！', '#d48806');
      }
    }
  }
}
// 3D 死亡爆发粒子（在怪死亡处原地喷发）
function burstAt(center, n, big){
  const cols = big ? [0xffd700,0xffae00,0xff7a7a,0xd48806,0xffffff] : [0x3fae5a,0xe07856,0xd48806,0x2e8b57];
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(big?0.08:0.06,6,6),
      new THREE.MeshBasicMaterial({color:cols[(Math.random()*cols.length)|0],transparent:true,opacity:.95}));
    m.position.copy(center);
    const ang=Math.random()*Math.PI*2, up=Math.random()*Math.PI;
    const spd=(big?3:2)+Math.random()*(big?4:3);
    burstPool.push({m, vx:Math.sin(up)*Math.cos(ang)*spd, vy:Math.cos(up)*spd+1, vz:Math.sin(up)*Math.sin(ang)*spd, life:1});
    scene.add(m);
  }
}
// 死亡冲击波圆环（地面扩散光环）
function spawnRing(pos, maxR, color){
  const m=new THREE.Mesh(new THREE.RingGeometry(.34,.46,32),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85,side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2; m.position.set(pos.x,0.06,pos.z);
  scene.add(m);
  burstPool.push({m, ring:true, life:1, maxR});
}
function battleTick(now){
  if(!battleBusy) return;
  const dt = lastBattleTick ? Math.min(0.05, (now-lastBattleTick)/1000) : 0.016;
  lastBattleTick = now;
  const elapsed = now - battleStart;
  // 按波次计划放小怪进场
  while(spawnQueue.length && spawnQueue[0].t <= elapsed){
    spawnMinion(spawnQueue.shift());
  }
  // 战士自动攻击最近的敌人（含养成暴击 + 狂暴增伤）
  if(now >= heroNextAttack){
    const target = findNearestEnemy();
    if(target){
      // 战士「双手念诀 → 凝聚能量 → 飞刀出鞘」，直取最近目标
      const fromV = heroGroup.position.clone().add(new THREE.Vector3(0,1.32,-0.5));
      const toV = target.group.position.clone().add(new THREE.Vector3(0, target.type==='boss'?2.2:1.0, 0));
      throwKnife(fromV, toV, 230);
      heroCastT = now;                       // 触发「念诀施法」动画
      Sfx.swing();
      let dmg = heroAtk();
      const crit = Math.random() < heroBonus().crit;
      if(crit) dmg = Math.round(dmg*2);      // 暴击×2
      damageEnemy(target, dmg, crit);
      updateBars();
    }
    heroNextAttack = now + heroAttackInterval()*1000;
  }
  // 敌人推进：前排逼近战士，后排保持间距排队（不再一拥而上）
  // 小怪：贴身后形成围攻队列，改为按时间的持续消耗（速率只与最大生命挂钩，与怪数/DPS无关 → 后期怪海也不会暴毙）
  // BOSS：保留独立近战（起手时间+攻击间隔+自身攻击力），是每关的主要单体威胁
  const sorted = enemies.filter(e=>e.alive).sort((a,b)=>b.group.position.z-a.group.position.z);
  let limit = HERO_Z - CONTACT_DIST, minionEngaged = false;
  for(const e of sorted){
    const p = e.group.position;
    if(p.z < limit || e.berserk){            // 狂暴BOSS无视前排队列，直接冲脸
      const rec = hurtW(now,e), att = atkW(now,e);
      let dz = e.speed*dt;
      if(att>0) dz += att*e.speed*1.5*dt;    // 进攻：前扑一小步
      if(rec>0) dz -= rec*e.speed*1.7*dt;    // 受伤：后退一小步（被击中击退）
      p.z = Math.min(limit, p.z + dz);
    }
    // 横向缓慢并道归位（向各自车道中心靠拢，队形自然）
    p.x += (e.homeX - p.x) * Math.min(1, dt*1.4);
    const atFront = p.z >= HERO_Z - CONTACT_DIST - 0.05;
    if(e.type==='minion' && atFront){
      // 贴身小怪周期性前扑撕咬（进攻动作）
      if(now >= (e.animAtk||0)){ e.atkAt = now; e.animAtk = now + 780 + Math.random()*340; }
    }
    if(e.type==='minion'){
      if(atFront) minionEngaged = true;   // 贴身标记：围攻消耗生效
    }else if(atFront){
      // BOSS近战：首击抬爪起手，之后按间隔重击
      if(!e.inContact){ e.inContact = true; e.nextMelee = now + MELEE_WINDUP*1000; }
      if(now >= e.nextMelee){
        e.nextMelee = now + MELEE_INTERVAL*1000;
        e.atkAt = now;                       // 触发BOSS进攻前扑动画
        P.hp = Math.max(0, P.hp - e.atk);
        flashHero(); damageFlash(); screenShake(0.32); Sfx.hurt();
        floatText(heroGroup.position.clone().add(new THREE.Vector3(0,2.8,0)), '-'+e.atk, '#e04444');
        updateBars();
        if(P.hp<=0){ endCombat(false); return; }
      }
    }else{
      e.inContact = false;
    }
    // 后排不得越过前排（保持队形间距，小怪排得更密形成多行队列）
    if(!e.berserk) limit = Math.min(limit, p.z - (e.type==='boss'?2.1:0.95));
  }
  // 小怪围攻消耗：只要有小怪贴身，每秒损失最大生命的6%（整数结算，掉血可见但不致命）
  if(minionEngaged){
    chipAcc += P.maxHp * MINION_CHIP_RATIO * dt;
    const n = Math.floor(chipAcc);
    if(n > 0){
      chipAcc -= n;
      P.hp = Math.max(0, P.hp - n);
      flashHero(); damageFlash(); screenShake(0.15); Sfx.hurt();
      floatText(heroGroup.position.clone().add(new THREE.Vector3(0,2.8,0)), '-'+n, '#e04444');
      updateBars();
      if(P.hp<=0){ endCombat(false); return; }
    }
  }else{
    chipAcc = 0;  // 小怪清空/脱离接触后不累积
  }
  // BOSS 决战提示
  if(!bossDuelNoted && !spawnQueue.length
     && enemies.some(e=>e.alive&&e.type==='boss')
     && !enemies.some(e=>e.alive&&e.type==='minion')){
    bossDuelNoted = true;
    const tip = ui.querySelector('#btip');
    if(tip) tip.textContent = '👑 BOSS 决战！注意血量！';
  }
  // 检查胜利：出兵完毕且所有敌人死亡
  if(!spawnQueue.length && enemies.every(e=>!e.alive)){ endCombat(true); }
}
function clearEnemies(){
  for(const e of enemies){ if(e.group){ scene.remove(e.group); disposeGroup(e.group); } }
  enemies = [];
}
let lastSecIdx = 0;                // 刚刚通关的小节索引（数学模式结算用）
let failFallT0 = 0;                // 失败CG：英雄倒地动画起点时间戳（0=未播放）

    // 首关通关：静默记录用时，作为之后所有关卡的小怪阶段时长基准（不展示给玩家）
    if(P.round===0 && !P.stage1Time){

    P.score += 100 + P.hp*10;
    lastSecIdx = P.round;          // 结算的是这个小节

    P.hp = Math.min(P.maxHp, P.hp + Math.max(4, Math.round(P.maxHp*HEAL_RATIO)));

  const total = P.correct + P.wrong;
  const ratio = total>0 ? P.correct/total : 0;
  let stars;
  if(P.wrong===0 && P.correct>0) stars=3;
  else if(ratio>=0.8) stars=2;
  else stars=1;
  const key = secKey(level, idx);
  const oldStars = PF.stars[key]||0;
  const isNewBest = stars > oldStars;
  PF.stars[key] = Math.max(oldStars, stars);
  PF.stats.sections++;
  // 奖励结算（星级为主力经验：全星通关 ≈ 满级）

/* ============ 炫酷音效引擎 v2（Web Audio 合成+混响，更响亮更动听） ============ */
const Sfx = {
  ctx:null, master:null, bus:null, delay:null, enabled:true, vol:0.9,
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    // 音量总线
    this.master = this.ctx.createGain();
    this.master.gain.value = this.vol;
    this.master.connect(this.ctx.destination);
    // 效果总线：全局语音压缩，让声音更厚更稳
    this.bus = this.ctx.createDynamicsCompressor();
    this.bus.threshold.value = -18; this.bus.knee.value=20; this.bus.ratio.value=6;
    this.bus.attack.value=0.003; this.bus.release.value=0.2;
    this.bus.connect(this.master);
    // 回响延迟（营造空间感）
    this.delay = this.ctx.createDelay(0.6);
    this.delay.delayTime.value = 0.16;
    const fb = this.ctx.createGain(); fb.gain.value = 0.3;
    const wet = this.ctx.createGain(); wet.gain.value = 0.25;
    this.delay.connect(fb); fb.connect(this.delay);
    this.delay.connect(wet); wet.connect(this.master);
  },
  toggle(){ this.enabled = !this.enabled; return this.enabled; },
  // 富音色合成：基波 + 2个泛音 + 可选噪声，接入压缩与混响
  _voice(freq, dur, type, vol, slideTo, delay, chord){
    const t = this.ctx.currentTime + (delay||0);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t+dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g);
    g.connect(this.bus);
    g.connect(this.delay);
    osc.start(t); osc.stop(t+dur+0.1);
    // 泛音：高八度正弦，让音色更亮
    if(chord!==false){
      const o2=this.ctx.createOscillator();
      const g2=this.ctx.createGain();
      o2.type='sine'; o2.frequency.setValueAtTime(freq*2.01, t);
      g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(vol*0.28, t+0.01);
      g2.gain.exponentialRampToValueAtTime(0.0001, t+dur*0.8);
      o2.connect(g2); g2.connect(this.bus); g2.connect(this.delay);
      o2.start(t); o2.stop(t+dur+0.1);
    }
  },
  tone(freq,dur,type,vol,slideTo,delay,chord){ if(this.enabled){ this.init(); this._voice(freq,dur,type,vol,slideTo,delay,chord); } },
  noise(dur, vol, delay, f){
    if(!this.enabled) return;
    this.init(); if(!this.ctx) return;
    const t = this.ctx.currentTime + (delay||0);
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.2);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    const flt=this.ctx.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=f||2500; flt.Q.value=0.8;
    src.connect(flt); flt.connect(g); g.connect(this.bus); g.connect(this.delay);
    src.start(t);
  },
  // ============ 各场景音效（响度 + 音色 + 混响） ============
  click(){ this.tone(760,0.08,'square',0.35,520); },
  hover(){ this.tone(990,0.05,'sine',0.25,760); },
  correct(){
    this.tone(523,0.12,'triangle',0.5,0,0,false);
    this.tone(784,0.14,'triangle',0.5,0,0.09,false);
    this.tone(1046,0.22,'triangle',0.55,0,0.18,false);
    this.tone(1568,0.28,'sine',0.3,0,0.18,false);
    this.noise(0.25,0.25,0.15,6000);
  },
  wrong(){ this.tone(196,0.32,'sawtooth',0.5,98); this.tone(147,0.42,'sawtooth',0.45,73,0.08); this.noise(0.2,0.3,0,400); },
  upgrade(){
    this.tone(523,0.1,'sawtooth',0.45,0,0,false);
    this.tone(659,0.12,'sawtooth',0.48,0,0.07,false);
    this.tone(784,0.12,'sawtooth',0.48,0,0.14,false);
    this.tone(1046,0.3,'square',0.4,0,0.21,false);
    this.noise(0.3,0.3,0.2,7000);
  },
  swing(){ this.noise(0.16,0.35,0,5500); this.tone(1800,0.1,'sine',0.2,0,0,false); },
  hit(){ this.tone(300,0.1,'square',0.55,140); this.noise(0.1,0.4,0,1800); this.tone(150,0.12,'sine',0.4,80); },
  bossHit(){ this.tone(160,0.16,'square',0.65,90); this.noise(0.16,0.5,0,900); this.tone(80,0.2,'sine',0.55,45); this.noise(0.06,0.4); },
  explode(){ this.noise(0.5,0.7,0,1200); this.noise(0.25,0.5,0,3000); this.tone(100,0.5,'sawtooth',0.55,40); },
  hurt(){ this.tone(160,0.24,'sawtooth',0.65,70); this.noise(0.2,0.45,0,900); this.tone(75,0.28,'sine',0.5,40); },
  win(){
    this.tone(523,0.18,'triangle',0.55,0,0,false);
    this.tone(659,0.18,'triangle',0.55,0,0.12,false);
    this.tone(784,0.18,'triangle',0.55,0,0.24,false);
    this.tone(1046,0.5,'triangle',0.6,0,0.36,false);
    this.tone(1318,0.5,'sine',0.35,0,0.36,false);
    this.tone(523,0.8,'sine',0.22,0,0.36,false);
    this.noise(0.5,0.3,0.4,8000);
  },
  lose(){
    this.tone(311,0.35,'sawtooth',0.5,155);
    this.tone(233,0.5,'sawtooth',0.5,116,0.25);
    this.tone(155,0.7,'sawtooth',0.45,80,0.5);
    this.noise(0.4,0.35,0.5,300);
  },
};

function flashMesh(root){
  if(!root) return;
  const ud = root.userData || {};
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(ud.flashR||1.25, 12, 12),
    new THREE.MeshBasicMaterial({color:0xff5c5c, transparent:true, opacity:0.5})
  );
  shell.position.set(0, ud.flashY||1.7, 0); root.add(shell);
